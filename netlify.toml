# Netlify は本番配信をやめ、Cloudflare Pages（kiyotomokuroda.pages.dev）へ
# 一本化しました。このファイルは、Netlify 側に残っている
# kiyotomokuroda.netlify.app を新ホストへ 301 で送るためだけにあります。
#
# 同じ内容が2つのホストで配信されると評価が分散し、どちらも上がりません。
# 旧ホストを消すのではなく 301 を張るのは、旧URLが獲得した評価を
# 新URLへ引き継ぐためです。
#
# Netlify をこのリポジトリに繋いでいない場合、このファイルは何もしません。
# その場合は Netlify 側のサイトで、同じ 301 を手動で設定するか、
# サイトごと削除してください（削除すると評価は引き継がれません）。

[build]
  publish = "public"
  # 生成ファイルはコミット済みなので、ここでの役目は再検証です。
  # python3 が無い想定外の環境でデプロイ全体が止まらないよう保護しています。
  command = "if command -v python3 >/dev/null 2>&1; then python3 build.py --check; else echo 'python3 unavailable - skipping SEO checks'; fi"

# すべてのパスを、対応する新ホストのパスへ 301。
[[redirects]]
  from = "/*"
  to = "https://kiyotomokuroda.pages.dev/:splat"
  status = 301
  force = true

# Deploy Preview とブランチデプロイは別ホスト名で公開されるため、
# 本番と重複した内容がインデックスされないようにします。
[context.deploy-preview]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex, nofollow"

[context.branch-deploy]
  [[context.branch-deploy.headers]]
    for = "/*"
    [context.branch-deploy.headers.values]
      X-Robots-Tag = "noindex, nofollow"
