# Netlify configuration for 黒田塾 (kiyotomokuroda.netlify.app)
#
# The site is plain static HTML: there is nothing to compile, so the build
# command only regenerates the derived SEO files (sitemap.xml, robots.txt,
# llms.txt, feed.xml) and fails the deploy if an SEO invariant is broken.

[build]
  publish = "public"
  # stdlib only, so there is nothing to pip install. Guarded so that an
  # unexpected build image without python3 cannot block a deploy: the
  # generated files are committed, and this command only re-verifies them.
  command = "if command -v python3 >/dev/null 2>&1; then python3 build.py --check; else echo 'python3 unavailable - skipping SEO checks'; fi"

# Canonical host. Netlify serves every deploy on a permanent
# <deploy-id>--<site>.netlify.app URL as well as the primary domain; without
# this the same content is reachable on several hostnames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fingerprinted assets never change under a given name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The share cards are NOT fingerprinted: regenerating one keeps its URL, so it
# must never be cached immutably. This is why they live outside /assets/.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Root-level images, listed explicitly: Netlify matches header rules by path,
# so an extension glob such as "/*.webp" is not dependable.
[[headers]]
  for = "/profile.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/profile-600.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/profile-900.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-card.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Derived text files are regenerated on every deploy; let crawlers revalidate.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/plain; charset=utf-8"

# Deploy previews and branch deploys must never compete with the live site in
# the index. Netlify exposes these as separate hostnames, so gate them by
# context rather than by path.
[context.deploy-preview]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex, nofollow"

[context.branch-deploy]
  [[context.branch-deploy.headers]]
    for = "/*"
    [context.branch-deploy.headers.values]
      X-Robots-Tag = "noindex, nofollow"
