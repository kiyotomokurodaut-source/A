                  "body": '''<p class="intro">難しい問題ほど、「知っている解法が見つかるまで待つ」勉強は再現性が下がります。条件と目標の間に何が足りないかを言葉にし、使う道具を選ぶ練習へ変えます。</p><section><h2>問題を見たら3行だけ書く</h2><ol><li><strong>条件：</strong>今使える事実は何か。</li><li><strong>目標：</strong>何を示す・求めるのか。</li><li><strong>橋渡し：</strong>条件から目標へ行くために作りたい量・関係は何か。</li></ol><p>たとえば「最大値を求める」なら、いきなり微分するのではなく、変数範囲、式の形、等号条件までが橋渡し候補になります。</p></section><section><h2>完答できないときの答案戦略</h2><p>試験中は、解けない問題を白紙にするか、途中まで書くかの判断が必要です。次の優先順位で確認します。</p><ul><li>問題の条件から確実に言える式がある。</li><li>場合分けの軸が決まっている。</li><li>必要条件までは示せる。</li><li>図形なら座標・ベクトル等の設定が妥当である。</li></ul><p>ただし、根拠のない式を大量に書くことが部分点戦略ではありません。採点基準は年度・問題ごとに異なるため、「この一行で必ず何点」という扱いはしません。</p></section><section><h2>復習は解答を写さず、橋渡しだけ再現する</h2><p>解説を読んだ後、解答を閉じて「なぜその式・補助変数・場合分けが必要だったか」を一文で説明します。翌日に条件を少し変えた問題で同じ判断ができれば、解法が問題固有の暗記から離れ始めています。</p><p><a href="/study-guides/todai-math-review/">東大数学の復習法</a>と<a href="/study-guides/todai-math-2026-3/">2026年理系数学第3問の図解</a>も参照してください。</p></section>'''
