          python3 /tmp/kuroda_content_fix.py /tmp/kuroda_content_updates.json

      - name: Validate full site and regenerate sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py --check
          git diff --check

      - name: Publish validated content corrections
        shell: bash
        run: |
          set -euo pipefail
          git add -- public
          if git diff --cached --quiet; then
            echo "Content corrections are already applied."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct Japanese summary format and 120-minute English plan"
          # A concurrent update to main is rejected rather than overwritten.
          git push origin HEAD:main
          echo "Committed correction: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
