                  "body": '''<p class="intro">英作文で語彙の難しさを追うと、内容と文法の両方が崩れやすくなります。まず日本語でもよいので「何を主張し、なぜそう言えるか」を短く固定し、その範囲だけを英語にします。</p><section><h2>書く前の30秒で3行を作る</h2><ol><li><strong>主張：</strong>賛成・反対、または自分の立場。</li><li><strong>理由：</strong>主張を直接支える理由を一つ。</li><li><strong>具体化：</strong>理由が現実にどう働くか。</li></ol></section><section><h2>自作課題</h2><div class="example"><p><b>Question</b></p><p>Should students be allowed to use smartphones during class when they believe the devices help them learn?</p></div><h3>構想</h3><p>原則は制限する。ただし教師が学習目的を指定した場面では使用を認める。理由は、自由使用だと注意を授業外へ移しやすいが、目的を限定すれば検索や記録に役立つから。</p><h3>答案例</h3><p><em>Students should not be free to use smartphones whenever they want during class. Unrestricted use can easily distract them from the lesson. However, teachers may allow phones for a specific learning task, such as checking information or recording an experiment. Clear limits make the device a tool rather than a distraction.</em></p><p class="fine-print">課題・答案は説明用のオリジナルです。実際の入試問題ではありません。</p></section><section><h2>見直しは「論理→文法→語法」の順</h2><p>最初に主張と理由がつながっているかを確認します。次に主語・動詞・時制・単複を確認し、最後に不自然な語の組み合わせを直します。語彙を華やかにする作業は最後です。</p><div class="summary-box"><strong>避けたい修正</strong><p>見直し時間に文を丸ごと難しい構文へ書き換えること。新しいミスを増やす可能性があります。</p></div></section>'''
