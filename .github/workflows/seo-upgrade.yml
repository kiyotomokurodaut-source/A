                  "body": '''<p class="intro">受験が近づくほど、保護者側も進捗が気になります。ただし、毎日の勉強時間や教材ページを細かく監視すると、本人が「報告のために勉強する」状態になりやすくなります。役割を分けて支える方が状況を見やすくなります。</p><section><h2>保護者が持ちやすい4つの役割</h2><ol><li><strong>環境：</strong>睡眠・食事・学習場所・移動の調整。</li><li><strong>費用：</strong>塾・模試・受験料・交通費の条件を早めに共有。</li><li><strong>意思決定：</strong>志望校・併願校について、期限と必要情報を一緒に確認。</li><li><strong>振り返り：</strong>結果を責めず、「次に変える一つ」を本人に言葉にしてもらう。</li></ol></section><section><h2>毎日聞かなくても確認できる形にする</h2><p>「今日は何時間勉強した？」を毎日聞く代わりに、週に一度、次週の課題と困っていることだけ共有する方法があります。本人が自分で管理できているなら、確認頻度はさらに下げても構いません。</p></section><section><h2>第三者を入れる判断</h2><p>親子で学習の話をすると毎回衝突する、必要な教材・科目の判断がつかない、本人が計画を立てても修正できない場合は、学校・塾・家庭教師など第三者へ整理を任せる意味があります。黒田塾では<a href="/study-coaching/">学習管理のみ</a>の相談もできます。</p></section>'''
              },
          ]

          def page_html(page: dict) -> str:
              slug, title, h1, desc = page["slug"], page["title"], page["h1"], page["desc"]
              breadcrumbs = f'''<nav aria-label="パンくずリスト"><ol class="breadcrumbs"><li><a href="/">黒田塾</a></li><li><a href="/study-guides/">学習ガイド</a></li><li aria-current="page">{escape(h1)}</li></ol></nav>'''
              byline = '<p class="byline">執筆・監修：<a href="/about/">黒田清友</a>（東京大学教育学部卒）｜最終更新：2026年9月26日</p>'
              related = '<nav aria-label="関連ページ" class="r15-related"><a href="/study-guides/">学習ガイド一覧</a><a href="/university-exam/">大学受験の個別指導</a><a href="/todai-juku/">東大対策</a><a href="/about/">講師紹介</a></nav>'
              cta = '<div class="cta-box"><h2>答案・計画を個別に整理したい方へ</h2><p>一般論では判断しにくい場合は、現在の教材・答案・模試結果をもとに、次に直す課題を整理します。無料相談はオンラインで30分程度です。</p><a class="btn btn-line" href="https://lin.ee/YXdwMqY" rel="noopener" target="_blank">LINEで相談する</a></div>'
              return common_head(title, desc, slug, h1) + HEADER + f'<main class="detail" id="main-content">{breadcrumbs}<h1>{escape(h1)}</h1>{byline}{page["body"]}{related}{cta}</main>' + FOOTER

          def create_pages() -> None:
              for page in PAGES:
                  write(PUBLIC / "study-guides" / page["slug"] / "index.html", page_html(page))

          def add_hub_links() -> None:
              path = PUBLIC / "study-guides" / "index.html"
              html = read(path)
              old_title = "無料の学習シート・英語と数学の例題｜受験勉強の学習ガイド｜黒田塾"
              new_title = "無料の受験勉強ガイド・例題・計画シート｜黒田塾"
              old_desc = "英語・数学の例題と詳しい解説、模試の復習シート、週間計画、塾の宿題の記録、塾選びの比較を無料公開。6つの学習ガイドを悩みから選べます。本文と記入ツールは会員登録・LINE登録なしで利用できます。"
              new_desc = "東大英語・数学、大学受験の勉強計画、浪人生の計画、英語・数学の例題、模試復習、週間計画を無料公開。答案の直し方から保護者支援まで、悩み別に選べる学習ガイドです。"
              html = html.replace(old_title, new_title).replace(old_desc, new_desc)
              marker = 'id="seo-upgrade-guides"'
              if marker not in html:
                  cards = []
                  for p in PAGES:
                      url = f'/study-guides/{p["slug"]}/'
                      cards.append(f'<article><h3><a href="{url}">{escape(p["h1"])}</a></h3><p>{escape(p["desc"])}</p></article>')
                  block = '<section id="seo-upgrade-guides"><h2>2026年9月追加：東大対策・受験計画を具体化する</h2><p>検索で集めた一般論ではなく、答案・時間・復習のどこを直すかまで落とせるよう、テーマ別のガイドを追加しました。</p><div class="r7-resource-grid">' + ''.join(cards) + '</div></section>'
                  html = html.replace('<section id="advanced-math">', block + '<section id="advanced-math">', 1)
              write(path, html)

          def insert_block(path: Path, marker: str, block: str, anchor: str = '</main>') -> None:
              html = read(path)
              if marker in html:
                  return
              html = html.replace(anchor, block + anchor, 1)
              write(path, html)

          def strengthen_internal_links() -> None:
              insert_block(PUBLIC / "todai-juku" / "index.html", 'id="english-strategy-cluster"', '''<section id="english-strategy-cluster"><h2>東大英語を、失点原因ごとに対策する</h2><p>英語全体の戦略から、要約・英作文・リスニング・時間配分まで分けて公開しています。</p><div class="r7-resource-grid"><article><h3><a href="/study-guides/todai-english-strategy/">東大英語対策の全体像</a></h3><p>読解・要約・英作文・リスニング・時間配分を診断。</p></article><article><h3><a href="/study-guides/todai-english-summary/">要約対策</a></h3><p>自作英文で情報を削る順番を確認。</p></article><article><h3><a href="/study-guides/todai-english-writing/">英作文対策</a></h3><p>論理を先に作り、減点を増やさない答案へ。</p></article><article><h3><a href="/study-guides/todai-listening/">リスニング対策</a></h3><p>誤答を4原因に分けて復習。</p></article><article><h3><a href="/study-guides/todai-english-time-allocation/">時間配分</a></h3><p>固定分数ではなく撤退時刻で管理。</p></article><article><h3><a href="/study-guides/todai-bunkei-math-strategy/">東大文系数学</a></h3><p>方針選択と答案戦略を言語化。</p></article></div></section>''')
              insert_block(PUBLIC / "university-exam" / "index.html", 'id="planning-guides-20260926"', '''<section id="planning-guides-20260926"><h2>学習計画を、自分の状況に合わせて組み直す</h2><div class="r7-resource-grid"><article><h3><a href="/study-guides/university-study-plan/">大学受験の勉強計画</a></h3><p>年間・週間・毎日を合格点から逆算。</p></article><article><h3><a href="/study-guides/gap-year-study-plan/">浪人生の勉強計画</a></h3><p>長時間学習より週ごとの測定を重視。</p></article><article><h3><a href="/study-guides/coaching-vs-private-tutoring/">受験コーチングと個別指導の違い</a></h3><p>困っている場所から必要な支援を判断。</p></article><article><h3><a href="/study-guides/parents-university-exam/">大学受験で親ができること</a></h3><p>管理しすぎず相談しやすい条件を整える。</p></article></div></section>''')
              insert_block(PUBLIC / "index.html", 'id="latest-guides-20260926"', '''<section id="latest-guides-20260926"><div class="wrap"><div class="sec-head"><span class="eyebrow">LATEST GUIDES</span><h2>答案と計画を、自分で直せるところまで公開する。</h2><p class="lead">東大英語・東大文系数学・大学受験の計画について、具体的な診断手順と自作例題を追加しました。</p></div><div class="guide-links"><article class="guide-card"><h3>東大英語対策</h3><p>要約・英作文・リスニング・時間配分を失点原因から分解。</p><a href="/study-guides/todai-english-strategy/">東大英語対策の全体像</a></article><article class="guide-card"><h3>東大文系数学</h3><p>条件・目標・橋渡しの3行で方針を言語化。</p><a href="/study-guides/todai-bunkei-math-strategy/">東大文系数学の答案戦略</a></article><article class="guide-card"><h3>大学受験の勉強計画</h3><p>参考書のページ数ではなく、合格点との差から逆算。</p><a href="/study-guides/university-study-plan/">勉強計画の作り方</a></article></div></div></section>''', '</main>')
              # Site map is a discovery hub; add all new URLs in a compact block.
              links = ''.join(f'<li><a href="/study-guides/{p["slug"]}/">{escape(p["h1"])}</a></li>' for p in PAGES)
              insert_block(PUBLIC / "site-map" / "index.html", 'id="new-guides-20260926"', f'<section id="new-guides-20260926"><h2>東大対策・受験計画の追加ガイド</h2><ul>{links}</ul></section>')

          def update_release_and_dates() -> None:
              for path in PUBLIC.rglob("*.html"):
                  html = read(path)
                  if any(f'/study-guides/{p["slug"]}/' in str(path).replace('\\','/') for p in PAGES):
                      pass
                  # Keep historical last-modified dates on unchanged pages; only the release marker changes.
                  html = html.replace("2026-09-21-r15-cloudflare", RELEASE)
                  write(path, html)

          def touch_modified_pages() -> None:
              for path in TOUCHED:
                  if not path.exists():
                      continue
                  html = read(path)
                  html = re.sub(r'<meta content="\d{4}-\d{2}-\d{2}" name="last-modified"\s*/?>', f'<meta content="{TODAY}" name="last-modified"/>', html, count=1)
                  write(path, html)

          def validate_new_pages() -> None:
              seen = set()
              for p in PAGES:
                  title, desc = p["title"], p["desc"]
                  if not (12 <= len(title) <= 40):
                      raise SystemExit(f"title length {len(title)}: {title}")
                  if not (60 <= len(desc) <= 130):
                      raise SystemExit(f"description length {len(desc)}: {desc}")
                  if title in seen:
                      raise SystemExit(f"duplicate title: {title}")
                  seen.add(title)

          def main() -> None:
              changed = replace_old_host()
              rewrite_netlify()
              create_pages()
              add_hub_links()
              strengthen_internal_links()
              add_about_evidence()
              update_release_and_dates()
              touch_modified_pages()
              for path in PUBLIC.rglob("*.html"):
                  enhance_jsonld_file(path)
              validate_new_pages()
              print(f"SEO upgrade applied; migrated host references in {changed} files; created {len(PAGES)} guides")

          if __name__ == "__main__":
              main()
          PY
          python3 /tmp/seo_upgrade.py

