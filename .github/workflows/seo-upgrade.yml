# r16.1: replace the previous seo-upgrade.yml with this file.
# Corrects existing articles only; does not add more pages or change hosting.
name: Kuroda School SEO Content Correction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuroda-school-seo-upgrade
  cancel-in-progress: false

jobs:
  correct-content:
    if: github.repository == 'kiyotomokurodaut-source/A' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correct Japanese summary and time allocation
        shell: bash
        run: |
          cat > /tmp/kuroda_content_fix.py <<'PYTHON'
          """Correct two r16 study guides without changing routes or other projects.

          Run from the repository root, with the JSON payload file as the only argument.
          All proposed changes are prepared and checked before any source is written.
          Only files below public/ are edited. Re-running is safe.
          """
          from __future__ import annotations

          import html
          import json
          import re
          import sys
          from html.parser import HTMLParser
          from pathlib import Path

          SITE = 'https://kurodaschool.jp'


          class PageFacts(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.h1_count = 0
                  self.ids: list[str] = []
                  self.canonicals: list[str] = []
                  self.durations: list[int] = []

              def handle_starttag(self, tag, attrs):
                  attr = dict(attrs)
                  if tag == 'h1':
                      self.h1_count += 1
                  if attr.get('id'):
                      self.ids.append(attr['id'])
                  if tag == 'link' and 'canonical' in attr.get('rel', '').split():
                      self.canonicals.append(attr.get('href', ''))
                  if tag == 'tr' and 'data-duration' in attr:
                      self.durations.append(int(attr['data-duration']))


          def validate_page(markup: str, slug: str, update: dict) -> None:
              facts = PageFacts()
              facts.feed(markup)
              if facts.h1_count != 1:
                  raise ValueError(f'{slug}: expected exactly one H1')
              if facts.canonicals != [f'{SITE}/study-guides/{slug}/']:
                  raise ValueError(f'{slug}: canonical mismatch')
              if len(facts.ids) != len(set(facts.ids)):
                  raise ValueError(f'{slug}: duplicate HTML id')
              if update['marker'] not in facts.ids:
                  raise ValueError(f'{slug}: correction marker missing')
              if update['old_h1'] in markup or update['old_desc'] in markup:
                  raise ValueError(f'{slug}: stale heading or metadata remains')
              blocks = re.findall(r'<script\b[^>]*type=[\"\']application/ld\+json[\"\'][^>]*>(.*?)</script>', markup, re.I | re.S)
              if not blocks:
                  raise ValueError(f'{slug}: missing structured data')
              for block in blocks:
                  json.loads(block)
              if slug == 'todai-english-summary':
                  match = re.search(r'<p\b[^>]*id="summary-model-answer"[^>]*>(.*?)</p>', markup, re.S)
                  if not match:
                      raise ValueError('Japanese model answer missing')
                  answer = html.unescape(re.sub('<[^>]+>', '', match.group(1)))
                  if len(answer) != 75:
                      raise ValueError(f'Japanese model answer is {len(answer)}, not 75 characters')
                  if '短い英語答案例' in markup:
                      raise ValueError('Incorrect English summary answer remains')
              elif slug == 'todai-english-time-allocation':
                  if facts.durations != [3, 15, 12, 10, 5, 30, 18, 15, 7, 5]:
                      raise ValueError('Time-allocation intervals do not match the reviewed example')
                  if sum(facts.durations) != 120:
                      raise ValueError('Time allocation must sum to 120 minutes')


          def apply(root: Path, updates: dict) -> list[Path]:
              public = root / 'public'
              if not (root / 'build.py').is_file() or not (public / 'index.html').is_file():
                  raise ValueError('Run this script from the Kuroda School repository root')
              target_by_path = {
                  public / 'study-guides' / slug / 'index.html': (slug, update)
                  for slug, update in updates.items()
              }
              for path in target_by_path:
                  if not path.is_file():
                      raise ValueError(f'Missing expected guide: {path}')
              proposals: dict[Path, str] = {}
              validated = set()
              for path in sorted(public.rglob('*.html')):
                  original = path.read_text(encoding='utf-8')
                  candidate = original
                  if path in target_by_path:
                      slug, update = target_by_path[path]
                      if f'id="{update["marker"]}"' not in candidate:
                          count = candidate.count(update['old_body'])
                          if count != 1:
                              raise ValueError(f'{path}: original content changed ({count} matches); review before updating')
                          candidate = candidate.replace(update['old_body'], update['body'], 1)
                          # Do not assert that the owner has already personally reviewed AI text.
                          candidate = candidate.replace('執筆・監修：', '解説制作：黒田塾（AI補助）｜指導担当：', 1)
                          candidate = candidate.replace('2026-09-26-r16-kurodaschool', '2026-09-26-r16.1-content-fix')
                  # Update references in hubs, breadcrumbs and structured data as well.
                  for update in updates.values():
                      candidate = candidate.replace(update['old_h1'], update['h1'])
                      candidate = candidate.replace(update['old_desc'], update['desc'])
                  if path in target_by_path:
                      slug, update = target_by_path[path]
                      validate_page(candidate, slug, update)
                      validated.add(slug)
                  if candidate != original:
                      proposals[path] = candidate
              if validated != set(updates):
                  raise ValueError('Not every intended correction was validated')
              # No writes happen until both corrected pages have passed the checks above.
              for path, candidate in proposals.items():
                  path.write_text(candidate, encoding='utf-8')
              return list(proposals)


          def main() -> None:
              if len(sys.argv) != 2:
                  raise SystemExit('Usage: python3 patch_content.py updates.json')
              updates = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
              if set(updates) != {'todai-english-summary', 'todai-english-time-allocation'}:
                  raise ValueError('Unexpected payload scope')
              changed = apply(Path.cwd(), updates)
              for path in changed:
                  print(path.relative_to(Path.cwd()))
              print(f'Content correction complete: {len(changed)} HTML files changed; 75-character answer and 120-minute plan validated.')


          if __name__ == '__main__':
              main()
          PYTHON
          cat > /tmp/kuroda_content_updates.json <<'JSON'
          {
            "todai-english-summary": {
              "h1": "東大英語の要約を、指定字数の日本語でまとめる手順",
              "desc": "東大英語の日本語要約を、主張・理由・対比の整理から指定字数の答案へつなげる方法を解説。自作英文、全文和訳、75字の答案例と誤答の直し方で練習できます。",
              "body": "<p class=\"intro\"><strong>東大英語の第1問(A)の要約は、日本語で答案を書く問題です。</strong>英語で短くまとめる課題とは区別してください。2026年度は70～80字の日本語要約で、書き出しの指定もありました。受験する年度の字数・書き出し・解答欄の指示を最優先にします。</p>\n<nav class=\"toc\" aria-label=\"このページの目次\"><strong>このページで分かること</strong><ol><li><a href=\"#summary-steps\">英文から日本語要約を作る手順</a></li><li><a href=\"#summary-practice\">自作英文と70～80字の練習</a></li><li><a href=\"#summary-feedback\">誤答の直し方</a></li><li><a href=\"#summary-sources\">形式の確認資料</a></li></ol></nav>\n<section id=\"summary-steps\"><h2>いきなり和訳を短くせず、文章全体の関係を整理する</h2><p>一文ずつの和訳を順番につなぐと、具体例を残しすぎたり、結論が落ちたりします。最初に「何について、何を主張し、それを何が支えているか」を日本語のメモで整理します。結論・理由・対比は、別々の単語ではなく関係として残すことが重要です。</p><ol><li><strong>設問条件を確認する。</strong>字数、指定された書き出し、要約する範囲を先に確認します。</li><li><strong>各段落の働きを書く。</strong>問題提起、一般的な見方、反論、具体例、結論などに仮分類します。</li><li><strong>本文の主張を一文にする。</strong>原因と結果、対比の前半と後半を対応させます。</li><li><strong>具体例を整理する。</strong>結論を説明するだけの例示は省略候補ですが、論点そのものになっている例を機械的に削ってはいけません。</li><li><strong>日本語で答案を書く。</strong>主語と述語の対応、指示語の内容、論理関係が本文に合うか確認します。</li><li><strong>最後に字数を数える。</strong>長ければ重複表現から削り、短ければ不足する主要情報を戻します。内容のない語句で字数を埋めません。</li></ol></section>\n<section id=\"summary-practice\"><h2>自作例題：英文を70～80字の日本語にまとめる</h2><p>次は要約の操作を確認するための短い基礎練習です。実際の入試問題ではなく、本文の長さ・抽象度も本試験と同じではありません。</p><div class=\"example\"><p lang=\"en\">Digital notifications are often described as small interruptions. Yet their cost is not limited to the seconds spent checking a screen. After attention has shifted, people may need additional time to reconstruct what they were thinking about. The problem, therefore, is not simply that devices take time away from work, but that frequent switching can make sustained thought harder to maintain.</p></div><p><strong>練習問題：</strong>本文の要旨を70～80字の日本語でまとめてください。この練習では句読点も1字と数え、改行・空白は答案に入れません。書き出しの指定はありません。</p><details class=\"r6-faq\"><summary>全文和訳・考え方・答案例を確認する</summary><h3>全文和訳</h3><p>デジタル機器の通知は、ささいな中断と説明されることがよくある。しかし、その負担は画面を確認する数秒だけに限られない。注意が別の対象へ移った後には、それまで考えていたことを組み立て直すため、さらに時間が必要になる場合がある。したがって問題は、機器が仕事の時間を奪うことだけではなく、頻繁な注意の切り替えによって、持続的な思考を保ちにくくなることにある。</p><h3>残す三つの情報</h3><p>まず「通知の負担は確認時間だけではない」という対比を残します。次に「注意がそれた後、思考の再構築に時間がかかりうる」という理由を残します。最後に、その結果として「持続的な思考が難しくなる」という結論につなぎます。</p><h3>日本語答案例：75字</h3><p class=\"example\" id=\"summary-model-answer\">通知の問題は確認時間だけではなく、注意がそれると元の思考を再構築するのに時間がかかりうるため、頻繁な切り替えによって持続的な思考が難しくなる点にある。</p><p>句読点を含めて75字です。別の表現でも、主要情報とその関係が保たれ、指定字数を満たしていれば答案の候補になります。これは本試験の公式解答・公式採点基準ではありません。</p></details></section>\n<section id=\"summary-feedback\"><h2>ありがちな誤答と直し方</h2><h3>確認に時間がかかる、だけで終える</h3><p>「通知を見る時間が無駄になるので仕事が遅れる」では、本文が強調する思考の再構築という負担が抜けます。「画面を見る時間」と「元の思考へ戻る時間」を区別して書き直します。</p><h3>本文にない禁止論を加える</h3><p>「だから学校ではスマートフォンを禁止すべきだ」は、この英文には書かれていません。要約は自分の賛否を述べる英作文ではないので、本文の説明から外れる提案は削ります。</p><h3>主張と具体例の順序だけを追う</h3><p>本文の語順をなぞるより、「確認時間以外にも負担がある。なぜなら何が起きるからか」という関係を短い日本語で作ります。答案を読んだ人が本文の論理を復元できるかを確認してください。</p><h3>英語で答えてしまう</h3><p>日本語要約を求められた問題で、英文の要約を書いてはいけません。指定が日本語の字数なのか、英作文の語数なのかを、答案を書く前に確認します。</p><p>解き直しでは、抜けた情報・取り違えた関係・本文にない追加の三つに分けて修正理由を残します。練習全体の進め方は<a href=\"/study-guides/todai-english-review/\">東大英語の復習法</a>、試験中の配分は<a href=\"/study-guides/todai-english-time-allocation/\">東大英語の時間配分</a>で確認できます。</p></section>\n<section id=\"summary-sources\"><h2>形式の確認資料と訂正履歴</h2><p>2026年度の解答形式は、<a href=\"https://www.zkai.co.jp/todai-exam/bunseki/eigo/\" rel=\"noopener\" target=\"_blank\">Ｚ会による2026年度東大英語の分析</a>の第1問(A)を参照しています。大学の<a href=\"https://www.u-tokyo.ac.jp/ja/admissions/undergraduate/r8_exam.html\" rel=\"noopener\" target=\"_blank\">2026年度試験問題の公開案内</a>では、英語は著作権上の理由から掲載されていません。上の練習英文と答案は黒田塾のオリジナルであり、Ｚ会や東京大学の問題を転載したものではありません。</p><p class=\"fine-print\" id=\"r16-quality-fix-summary\">訂正：2026年9月26日。初版の英語答案例と、英語で要約を書くように読める説明を、日本語要約の形式に修正しました。</p></section>",
              "marker": "r16-quality-fix-summary",
              "old_h1": "東大英語の要約は、英語を書く前に「残す情報」を決める",
              "old_desc": "東大英語の要約で、具体例を削り主張・因果・対比を残す手順を、自作英文と答案例で解説。本文を短く言い換えるだけにならないためのチェック方法も示します。",
              "old_body": "<p class=\"intro\">要約で最初に行うのは英訳ではありません。本文の情報を「主張」「理由」「具体例」「言い換え」に分け、字数が減っても論理が残る骨格を作ります。</p><section><h2>削る順番を固定する</h2><ol><li>同じ内容の言い換えをまとめる。</li><li>例示を、主張を理解するのに不要なら削る。</li><li>細かな修飾を削る。</li><li>最後まで残すのは、結論・因果・対比の転換点。</li></ol></section><section><h2>自作例題</h2><div class=\"example\"><p><b>Passage</b></p><p>Digital notifications are often described as small interruptions. Yet their cost is not limited to the seconds spent checking a screen. After attention has shifted, people may need additional time to reconstruct what they were thinking about. The problem, therefore, is not simply that devices take time away from work, but that frequent switching can make sustained thought harder to maintain.</p></div><h3>骨格を日本語で作る</h3><p>通知の問題は確認時間そのものだけでなく、注意を切り替えた後に思考を再構築する負担が生じ、持続的な思考を難しくすることにある。</p><h3>短い英語答案例</h3><p><em>Notifications cost more than the time used to check them because switching attention forces people to rebuild their train of thought, making sustained concentration harder.</em></p><p class=\"fine-print\">英文・答案はこのページのために作成したオリジナル例です。実際の東京大学入試問題の転載ではありません。</p></section><section><h2>自己採点は3問だけ</h2><ul><li>結論が残っているか。</li><li>因果関係の向きが変わっていないか。</li><li>本文にない評価を足していないか。</li></ul><p>語数より先にこの3点を確認し、その後で表現を短くします。全体の復習設計は<a href=\"/study-guides/todai-english-review/\">東大英語の復習法</a>へ。</p></section>",
              "title": "東大英語の要約対策｜情報を削る順番と自作例題｜黒田塾"
            },
            "todai-english-time-allocation": {
              "h1": "東大英語120分の時間配分｜リスニングと見直しを先に確保する",
              "desc": "東大英語の時間配分を、リスニング30分と見直し5分を含む合計120分の例で解説。経過時間と作業時間を区別し、過去問演習の記録から自分用に調整する手順を示します。",
              "body": "<p class=\"intro\">東大英語の時間配分では、リスニングの時間帯を先に確保し、残りの時間へ筆記問題と見直しを割り当てます。「問題ごとに何分使うか」だけでなく、「試験開始後何分になったら次へ進むか」を決めると、予定のずれに気づきやすくなります。</p>\n<nav class=\"toc\" aria-label=\"このページの目次\"><strong>このページで分かること</strong><ol><li><a href=\"#time-assumptions\">試験の固定条件と自分で決める配分</a></li><li><a href=\"#time-example\">合計120分の配分例</a></li><li><a href=\"#time-adjustment\">自分用に調整する方法</a></li><li><a href=\"#time-sources\">確認資料</a></li></ol></nav>\n<section id=\"time-assumptions\"><h2>動かせない時間帯を先に確保する</h2><p>2026年度の試験は120分です。大学の学内向け通知では、英語聞き取り試験の時間帯を14時45分頃～15時15分頃と案内しています。聞き取りの開始・終了は自分で変更できないので、この枠を筆記問題の遅れを取り戻す時間として数えないでください。</p><p>以下では、<strong>開始後45～75分を30分のリスニング枠とする練習条件</strong>を置きます。受験年度の実施要領や当日の案内が異なる場合はそちらを優先します。前後の筆記配分は黒田塾の説明用の例で、大学が推奨する解答順序ではありません。</p><div class=\"summary-box\"><strong>120分を使い切る前に、見直し枠を引く</strong><p>120分からリスニング30分と見直し5分を引くと、残りは85分です。この85分に、筆記の解答だけでなく全体確認や聞き取り準備も含めます。見直しを「余ったら」にすると、予定段階で確保できていないことになります。</p></div></section>\n<section id=\"time-example\"><h2>合計120分の配分例</h2><p>時間はすべて試験開始からの経過分数です。たとえば「18分」は、英作文を始めてから18分ではなく、<strong>試験開始から18分</strong>を意味します。</p><div class=\"table-scroll\" role=\"region\" aria-label=\"東大英語の時間配分例\" tabindex=\"0\"><table><caption>説明用の配分例。リスニングと見直しを含め合計120分。</caption><thead><tr><th scope=\"col\">経過時間</th><th scope=\"col\">作業</th><th scope=\"col\">割り当て</th><th scope=\"col\">次へ進む目安</th></tr></thead><tbody><tr data-duration=\"3\"><th scope=\"row\">開始後0～3分</th><td>全体確認</td><td>3分</td><td>開始後3分</td></tr><tr data-duration=\"15\"><th scope=\"row\">開始後3～18分</th><td>英作文</td><td>15分</td><td>開始後18分</td></tr><tr data-duration=\"12\"><th scope=\"row\">開始後18～30分</th><td>日本語要約</td><td>12分</td><td>開始後30分</td></tr><tr data-duration=\"10\"><th scope=\"row\">開始後30～40分</th><td>和訳</td><td>10分</td><td>開始後40分</td></tr><tr data-duration=\"5\"><th scope=\"row\">開始後40～45分</th><td>聞き取りの準備</td><td>5分</td><td>開始後45分</td></tr><tr data-duration=\"30\"><th scope=\"row\">開始後45～75分</th><td>リスニング</td><td>30分</td><td>開始後75分</td></tr><tr data-duration=\"18\"><th scope=\"row\">開始後75～93分</th><td>長文読解</td><td>18分</td><td>開始後93分</td></tr><tr data-duration=\"15\"><th scope=\"row\">開始後93～108分</th><td>文・語句補充など</td><td>15分</td><td>開始後108分</td></tr><tr data-duration=\"7\"><th scope=\"row\">開始後108～115分</th><td>文法・語法など</td><td>7分</td><td>開始後115分</td></tr><tr data-duration=\"5\"><th scope=\"row\">開始後115～120分</th><td>見直し</td><td>5分</td><td>開始後120分</td></tr></tbody><tfoot><tr><th colspan=\"2\" scope=\"row\">合計</th><td colspan=\"2\">120分</td></tr></tfoot></table></div><p>最初の45分、聞き取り30分、最後の45分で120分です。最後の45分には見直し5分を含めています。英作文が長引いても聞き取りの開始は待ってくれないため、開始40分後には準備へ移る設計にしています。</p><p class=\"fine-print\">個々の問題の難しさと得意不得意で配分は変わります。この表の分数を全員に強制するものではありません。解答が途中である問題は、戻る場所を答案・問題冊子上で分かるようにしてから移ります。</p></section>\n<section id=\"time-adjustment\"><h2>演習記録から、自分の配分へ直す</h2><ol><li><strong>本番と同じ総時間で解く。</strong>リスニングも別日に回さず、決めた時間帯に入れます。</li><li><strong>開始・終了と迷った場所を記録する。</strong>「読解に時間がかかった」ではなく、本文理解、選択肢比較、答案作成のどこに使ったかを分けます。</li><li><strong>終了後に時間を追加して解く。</strong>追加時間で正答できた問題と、追加しても解けなかった問題を区別します。</li><li><strong>配分変更には、減らす場所も指定する。</strong>読解を5分増やすなら、別の筆記枠から合計5分減らします。聞き取りと見直しの枠を二重に使ってはいけません。</li><li><strong>次の異なる問題で試す。</strong>同じ過去問は記憶の影響を受けます。復習用の解き直しと、時間配分の実戦テストを区別します。</li></ol><p>一題で決めず、複数回の記録から配分が崩れる場所を探します。時間を追加しても理解できなかった設問は、配分を増やすだけでなく、語彙・構文・論理・表現の復習へ戻します。</p></section>\n<section><h2>時間配分で起きやすい三つの失敗</h2><h3>リスニングを別枠にして筆記だけで120分使う</h3><p>総時間の外へ聞き取りを追加すると、実戦より多くの時間で練習してしまいます。必ず総時間の内側で設計します。</p><h3>撤退の時刻と、その問題の所要時間を混同する</h3><p>開始後30分で要約を離れる例なら、要約の作業時間は18～30分の12分です。「30分使う」と解釈しないでください。</p><h3>解けない原因を全部スピード不足と考える</h3><p>構文を取り違えている英文は、速読だけを増やしても同じ誤読が残ります。<a href=\"/study-guides/todai-english-strategy/\">東大英語の失点原因の整理</a>、<a href=\"/study-guides/todai-english-summary/\">日本語要約の練習</a>、<a href=\"/study-guides/todai-listening/\">リスニングの復習</a>へ原因別に戻してください。</p></section>\n<section id=\"time-sources\"><h2>確認資料と訂正履歴</h2><p>試験時間と問題形式は<a href=\"https://www.zkai.co.jp/todai-exam/bunseki/eigo/\" rel=\"noopener\" target=\"_blank\">Ｚ会による2026年度東大英語の分析</a>、聞き取り時間帯は<a href=\"https://www.s.u-tokyo.ac.jp/ja/current/info/10663/\" rel=\"noopener\" target=\"_blank\">東京大学理学部の2026年度前期日程試験に関する通知</a>を参照しています。時間帯以外の細かな配分は、このページの説明用の提案です。</p><p class=\"fine-print\" id=\"r16-quality-fix-time\">訂正：2026年9月26日。初版の「リスニングは試験形式に従う」「見直しは残り」という曖昧な表を、両方を含めて合計120分になる時系列表へ変更しました。</p></section>",
              "marker": "r16-quality-fix-time",
              "old_h1": "東大英語の120分を、固定配分ではなく撤退時刻で管理する",
              "old_desc": "東大英語の時間配分を、大問ごとの固定分数ではなく「上限・撤退・見直し」の3点で設計する方法を解説。過去問演習の記録から、自分用の120分プランを作る手順を示します。",
              "old_body": "<p class=\"intro\">時間配分は「各大問を何分で解くか」を一度決めて終わりではありません。難易度の揺れがある試験では、予定時間よりも「何分で一旦離れるか」を決める方が実戦的です。</p><section><h2>時間は3種類に分ける</h2><div class=\"r6-grid\"><div><h3>上限</h3><p>その大問に使ってよい最大時間。超えたら、完成度が低くても一旦離れます。</p></div><div><h3>撤退時刻</h3><p>時計の時刻で決めます。「開始から25分」より「試験開始35分後に移る」の方が本番で判断しやすくなります。</p></div><div><h3>見直し枠</h3><p>最後に戻るための時間。最初から0分にすると、一題の詰まりが全体へ波及します。</p></div></div></section><section><h2>120分の架空例</h2><p>次は説明用の一例で、東京大学が推奨する配分ではありません。</p><div class=\"table-scroll\"><table><thead><tr><th>作業</th><th>上限の例</th><th>記録すること</th></tr></thead><tbody><tr><td>全体確認</td><td>5分</td><td>重い設問を先に把握</td></tr><tr><td>読解・要約系</td><td>35分</td><td>本文理解と答案化を分ける</td></tr><tr><td>英作文系</td><td>20分</td><td>構想に使った時間も記録</td></tr><tr><td>その他の読解・文法等</td><td>30分</td><td>止まった設問番号を残す</td></tr><tr><td>リスニング・指定時間帯</td><td>試験形式に従う</td><td>直前の作業を持ち越さない</td></tr><tr><td>戻り・見直し</td><td>残り</td><td>空欄→高得点可能性の順に戻る</td></tr></tbody></table></div><p class=\"fine-print\">実際の大問構成・リスニング実施方法は年度の募集要項・試験問題で確認してください。</p></section><section><h2>3回分の記録で自分用に直す</h2><ol><li>各大問の開始・終了時刻を書く。</li><li>時間を追加したら正解できた問題に印を付ける。</li><li>追加しても解けなかった問題は、時間配分ではなく知識・読解の課題へ回す。</li><li>3回分の中央値を基準に、上限だけを調整する。</li></ol><p>同じ回を何度も送るのではなく、<a href=\"/study-guides/todai-english-strategy/\">東大英語の失点診断</a>とセットで使ってください。</p></section>",
              "title": "東大英語の時間配分｜120分を崩さない設計と練習法｜黒田塾"
            }
          }
