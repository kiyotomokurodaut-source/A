                  "body": '''<p class="intro">要約で最初に行うのは英訳ではありません。本文の情報を「主張」「理由」「具体例」「言い換え」に分け、字数が減っても論理が残る骨格を作ります。</p><section><h2>削る順番を固定する</h2><ol><li>同じ内容の言い換えをまとめる。</li><li>例示を、主張を理解するのに不要なら削る。</li><li>細かな修飾を削る。</li><li>最後まで残すのは、結論・因果・対比の転換点。</li></ol></section><section><h2>自作例題</h2><div class="example"><p><b>Passage</b></p><p>Digital notifications are often described as small interruptions. Yet their cost is not limited to the seconds spent checking a screen. After attention has shifted, people may need additional time to reconstruct what they were thinking about. The problem, therefore, is not simply that devices take time away from work, but that frequent switching can make sustained thought harder to maintain.</p></div><h3>骨格を日本語で作る</h3><p>通知の問題は確認時間そのものだけでなく、注意を切り替えた後に思考を再構築する負担が生じ、持続的な思考を難しくすることにある。</p><h3>短い英語答案例</h3><p><em>Notifications cost more than the time used to check them because switching attention forces people to rebuild their train of thought, making sustained concentration harder.</em></p><p class="fine-print">英文・答案はこのページのために作成したオリジナル例です。実際の東京大学入試問題の転載ではありません。</p></section><section><h2>自己採点は3問だけ</h2><ul><li>結論が残っているか。</li><li>因果関係の向きが変わっていないか。</li><li>本文にない評価を足していないか。</li></ul><p>語数より先にこの3点を確認し、その後で表現を短くします。全体の復習設計は<a href="/study-guides/todai-english-review/">東大英語の復習法</a>へ。</p></section>'''
