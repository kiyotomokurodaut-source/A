name: Kuroda School SEO Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuroda-school-seo-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply SEO upgrade
        shell: bash
        run: |
          cat > /tmp/seo_upgrade.py <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path
          from html import escape

          ROOT = Path.cwd()
          PUBLIC = ROOT / "public"
          OLD = "https://kiyotomokuroda.pages.dev"
          NEW = "https://kurodaschool.jp"
          TODAY = "2026-09-26"
          RELEASE = "2026-09-26-r16-kurodaschool"

          PERSON_SAME_AS = [
              "https://x.com/kurodaschool",
              "https://smartrador.com/teachers/6039e30a-2e2d-4d77-ab60-97ac663f2b05/",
              "https://jp.linkedin.com/in/%E6%B8%85%E5%8F%8B-%E9%BB%92%E7%94%B0-405187284",
              "https://mee-coo.com/jp_tutor/science/%E7%90%86%E7%A7%91/jp/10020/teacher_info_profile",
          ]
          ORG_SAME_AS = ["https://x.com/kurodaschool"]
          TOUCHED = {
              PUBLIC / "index.html",
              PUBLIC / "study-guides" / "index.html",
              PUBLIC / "todai-juku" / "index.html",
              PUBLIC / "university-exam" / "index.html",
              PUBLIC / "about" / "index.html",
              PUBLIC / "site-map" / "index.html",
          }

          def read(path: Path) -> str:
              return path.read_text(encoding="utf-8")

          def write(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding="utf-8")

          def replace_old_host() -> int:
              count = 0
              roots = [PUBLIC, ROOT / "build.py", ROOT / "README.md", ROOT / "SEO.md"]
              for item in roots:
                  paths = [item] if item.is_file() else list(item.rglob("*")) if item.exists() else []
                  for path in paths:
                      if not path.is_file():
                          continue
                      if path.suffix.lower() not in {".html", ".xml", ".txt", ".json", ".jsonc", ".js", ".css", ".md", ".py", ".webmanifest"}:
                          continue
                      try:
                          raw = read(path)
                      except UnicodeDecodeError:
                          continue
                      updated = raw.replace(OLD, NEW)
                      updated = updated.replace("2026-09-21-r15-cloudflare", RELEASE)
                      if updated != raw:
                          write(path, updated)
                          count += 1
              return count

          def rewrite_netlify() -> None:
              # Keep production on the permanent .jp domain. Alternate domains
              # and the old Netlify hostname are permanent aliases only.
              content = '''# Kuroda School production on Netlify\n# Canonical production domain: https://kurodaschool.jp\n\n[build]\n  publish = "public"\n  command = "python3 build.py --check"\n\n[[redirects]]\n  from = "https://kurodaschool.com/*"\n  to = "https://kurodaschool.jp/:splat"\n  status = 301\n  force = true\n\n[[redirects]]\n  from = "https://www.kurodaschool.com/*"\n  to = "https://kurodaschool.jp/:splat"\n  status = 301\n  force = true\n\n[[redirects]]\n  from = "https://www.kurodaschool.jp/*"\n  to = "https://kurodaschool.jp/:splat"\n  status = 301\n  force = true\n\n[[redirects]]\n  from = "https://kiyotomokuroda.netlify.app/*"\n  to = "https://kurodaschool.jp/:splat"\n  status = 301\n  force = true\n\n[context.deploy-preview]\n  [[context.deploy-preview.headers]]\n    for = "/*"\n    [context.deploy-preview.headers.values]\n      X-Robots-Tag = "noindex, nofollow"\n\n[context.branch-deploy]\n  [[context.branch-deploy.headers]]\n    for = "/*"\n    [context.branch-deploy.headers.values]\n      X-Robots-Tag = "noindex, nofollow"\n'''
              write(ROOT / "netlify.toml", content)

          def extract_jsonld_blocks(html: str):
              pattern = re.compile(r'<script\s+type="application/ld\+json">(.*?)</script>', re.S | re.I)
              return pattern, list(pattern.finditer(html))

          def enhance_jsonld_file(path: Path) -> None:
              html = read(path)
              pattern, matches = extract_jsonld_blocks(html)
              if not matches:
                  return
              replacements = []
              for m in matches:
                  try:
                      data = json.loads(m.group(1))
                  except json.JSONDecodeError:
                      continue
                  roots = data if isinstance(data, list) else [data]
                  changed = False
                  for root in roots:
                      nodes = root.get("@graph", [root]) if isinstance(root, dict) else []
                      for node in nodes:
                          if not isinstance(node, dict):
                              continue
                          typ = node.get("@type")
                          types = set(typ if isinstance(typ, list) else [typ])
                          if "WebSite" in types:
                              node["alternateName"] = ["Kuroda School", "黒田清友の個別指導塾", "黒田清友の家庭教師"]
                              changed = True
                          if "EducationalOrganization" in types or "Organization" in types:
                              node["sameAs"] = ORG_SAME_AS
                              changed = True
                          if "Person" in types and node.get("name") == "黒田清友":
                              node["sameAs"] = PERSON_SAME_AS
                              node["knowsAbout"] = [
                                  "東京大学受験", "東大英語", "東大数学", "大学受験", "中学受験",
                                  "学習計画", "受験コーチング", "英語", "数学", "国語", "社会"
                              ]
                              changed = True
                          if path in TOUCHED and "dateModified" in node:
                              node["dateModified"] = TODAY
                              changed = True
                          if path == PUBLIC / "study-guides" / "index.html" and "ItemList" in types and str(node.get("@id", "")).endswith("#resources"):
                              items = []
                              for pos, guide_path in enumerate(sorted((PUBLIC / "study-guides").glob("*/index.html")), 1):
                                  guide_html = read(guide_path)
                                  mt = re.search(r"<title>(.*?)</title>", guide_html, re.S)
                                  if not mt:
                                      continue
                                  slug = guide_path.parent.name
                                  items.append({
                                      "@type": "ListItem",
                                      "position": len(items) + 1,
                                      "name": re.sub(r"｜黒田塾$", "", mt.group(1).strip()),
                                      "url": f"{NEW}/study-guides/{slug}/",
                                  })
                              node["numberOfItems"] = len(items)
                              node["itemListElement"] = items
                              changed = True
                  if changed:
                      newdata = roots if isinstance(data, list) else roots[0]
                      blob = json.dumps(newdata, ensure_ascii=False, separators=(",", ":"))
                      replacements.append((m.start(1), m.end(1), blob))
              for a, b, blob in reversed(replacements):
                  html = html[:a] + blob + html[b:]
              write(path, html)

          def add_about_evidence() -> None:
              path = PUBLIC / "about" / "index.html"
              html = read(path)
              marker = 'id="external-profiles"'
              if marker in html:
                  return
              block = '''<section id="external-profiles"><h2>外部で確認できる講師プロフィール</h2><p>経歴や指導活動を、黒田塾のサイト内だけで完結させず、外部の公開プロフィールでも確認できるようにしています。各リンクは当該サービス上の公開情報です。</p><ul><li><a href="https://x.com/kurodaschool" rel="me noopener" target="_blank">X：@kurodaschool</a></li><li><a href="https://shiok.tokyo/teachers.php" rel="me noopener" target="_blank">学習塾Shiok! 講師紹介：黒田清友</a></li><li><a href="https://smartrador.com/teachers/6039e30a-2e2d-4d77-ab60-97ac663f2b05/" rel="me noopener" target="_blank">スマートレーダー 講師プロフィール</a></li><li><a href="https://jp.linkedin.com/in/%E6%B8%85%E5%8F%8B-%E9%BB%92%E7%94%B0-405187284" rel="me noopener" target="_blank">LinkedIn：黒田清友</a></li></ul><p class="fine-print">外部サイトへのリンクは、第三者による推薦・保証を意味するものではありません。各サービス上の表示内容・更新日は各運営元の情報をご確認ください。</p></section>'''
              anchor = '<section id="editorial-policy">'
              if anchor in html:
                  html = html.replace(anchor, block + anchor, 1)
              else:
                  html = html.replace('</main>', block + '</main>', 1)
              write(path, html)

          def common_head(title: str, desc: str, slug: str, h1: str) -> str:
              url = f"{NEW}/study-guides/{slug}/"
              image = f"{NEW}/og/study-guides.png"
              graph = {
                  "@context": "https://schema.org",
                  "@graph": [
                      {
                          "@type": "Article",
                          "@id": url + "#article",
                          "url": url,
                          "headline": title,
                          "description": desc,
                          "inLanguage": "ja",
                          "datePublished": TODAY,
                          "dateModified": TODAY,
                          "author": {"@id": NEW + "/#teacher"},
                          "publisher": {"@id": NEW + "/#organization"},
                          "mainEntityOfPage": {"@id": url + "#webpage"},
                      },
                      {
                          "@type": "WebPage",
                          "@id": url + "#webpage",
                          "url": url,
                          "name": title,
                          "description": desc,
                          "isPartOf": {"@id": NEW + "/#website"},
                          "breadcrumb": {"@id": url + "#breadcrumb"},
                          "dateModified": TODAY,
                      },
                      {
                          "@type": "BreadcrumbList",
                          "@id": url + "#breadcrumb",
                          "itemListElement": [
                              {"@type": "ListItem", "position": 1, "name": "黒田塾", "item": NEW + "/"},
                              {"@type": "ListItem", "position": 2, "name": "学習ガイド", "item": NEW + "/study-guides/"},
                              {"@type": "ListItem", "position": 3, "name": h1, "item": url},
                          ],
                      },
                      {
                          "@type": "WebSite",
                          "@id": NEW + "/#website",
                          "name": "黒田塾",
                          "alternateName": ["Kuroda School", "黒田清友の個別指導塾", "黒田清友の家庭教師"],
                          "url": NEW + "/",
                          "inLanguage": "ja",
                          "publisher": {"@id": NEW + "/#organization"},
                      },
                      {
                          "@type": "EducationalOrganization",
                          "@id": NEW + "/#organization",
                          "name": "黒田塾",
                          "url": NEW + "/",
                          "founder": {"@id": NEW + "/#teacher"},
                          "logo": NEW + "/favicon.png",
                          "sameAs": ORG_SAME_AS,
                          "areaServed": {"@type": "Country", "name": "日本"},
                          "availableLanguage": "ja",
                      },
                      {
                          "@type": "Person",
                          "@id": NEW + "/#teacher",
                          "name": "黒田清友",
                          "jobTitle": "プロ家庭教師・ラーニングアドバイザー",
                          "url": NEW + "/about/",
                          "image": NEW + "/profile.jpg",
                          "sameAs": PERSON_SAME_AS,
                          "alumniOf": {"@type": "CollegeOrUniversity", "name": "東京大学"},
                          "worksFor": {"@id": NEW + "/#organization"},
                          "knowsAbout": ["東京大学受験", "東大英語", "東大数学", "大学受験", "中学受験", "学習計画", "受験コーチング"],
                      },
                  ],
              }
              return f'''<!DOCTYPE html>\n<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>{escape(title)}</title><meta content="{escape(desc)}" name="description"/><meta content="index, follow, max-image-preview:large, max-snippet:-1" name="robots"/><link href="{url}" rel="canonical"/><meta content="article" property="og:type"/><meta content="ja_JP" property="og:locale"/><meta content="黒田塾" property="og:site_name"/><meta content="{escape(title)}" property="og:title"/><meta content="{escape(desc)}" property="og:description"/><meta content="{url}" property="og:url"/><meta content="{image}" property="og:image"/><meta content="1200" property="og:image:width"/><meta content="630" property="og:image:height"/><meta content="{escape(h1)}" property="og:image:alt"/><meta content="summary_large_image" name="twitter:card"/><meta content="{escape(title)}" name="twitter:title"/><meta content="{escape(desc)}" name="twitter:description"/><meta content="{image}" name="twitter:image"/><meta content="{TODAY}" name="last-modified"/><script type="application/ld+json">{json.dumps(graph, ensure_ascii=False, separators=(",", ":"))}</script><meta content="#fbfaf7" name="theme-color"/><link href="/favicon.png" rel="icon" sizes="96x96" type="image/png"/><link href="/feed.xml" rel="alternate" title="黒田塾｜学習ガイド" type="application/rss+xml"/><link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/><meta content="{RELEASE}" name="site-release"/><link href="/assets/site-r13-94a529657bd3.css" rel="stylesheet"/><link href="/assets/conversion-r14.css" rel="stylesheet"/><script defer="True" src="/assets/line-navigation-r15-594e7f6b001c.js"></script><link href="/assets/search-guide-r15-07e09aa80f72.css" rel="stylesheet"/></head>'''

          HEADER = '''<body><a class="skip-link" href="#main-content">本文へ移動</a><header><div class="wrap nav"><a aria-label="黒田塾 トップページ" class="logo" href="/"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M12 3C10 8 5 11 3 12c2 1 7 4 9 9 2-5 7-8 9-9-2-1-7-4-9-9Z" fill="#b1922f"></path><path d="M12 6v13" stroke="#fbfaf7" stroke-width="1.1"></path></svg> 黒田塾</a><nav aria-label="主要ページと指導案内" class="nav-links"><a href="/#policy">指導方針</a><a href="/cases/">指導事例</a><a href="/pricing/">料金</a><a href="/todai-juku/">東大受験</a><a href="/study-guides/">学習ガイド</a><a href="/about/">講師紹介</a></nav><a class="nav-cta" href="/contact/">無料受験診断</a><a class="nav-line" href="https://lin.ee/YXdwMqY" rel="noopener" target="_blank">LINE追加で無料特典</a></div><details class="mobile-menu wrap"><summary>指導案内・学習ガイドを開く</summary><nav aria-label="モバイルメニュー"><a href="/">トップページ</a><a href="/online-tutoring/">オンライン家庭教師</a><a href="/university-exam/">大学受験</a><a href="/study-guides/">学習ガイド</a><a href="/todai-juku/">東大受験</a><a href="/pricing/">料金</a><a href="/about/">講師紹介</a><a href="/faq/">よくある質問</a><a href="/contact/">無料受験診断</a></nav></details></header>'''
          FOOTER = '''<footer><div class="wrap"><nav aria-label="サービス案内" class="footer-links"><a href="/online-tutoring/">オンライン家庭教師</a><a href="/junior-high-exam/">中学受験</a><a href="/university-exam/">大学受験</a><a href="/study-guides/">学習ガイド</a><a href="/todai-juku/">東大受験</a><a href="/about/">講師紹介</a><a href="/pricing/">料金</a><a href="/faq/">よくある質問</a><a href="/contact/">無料受験診断</a><a href="/site-map/">ページ一覧</a></nav><p>黒田塾｜講師：黒田清友（東京大学教育学部卒）</p><p>© 2026 Kuroda Juku — Private Tutor</p><small class="release-marker">公開版 2026-09-26-r16-kurodaschool</small></div></footer></body></html>'''

          PAGES = [
              {
                  "slug": "todai-english-strategy",
                  "title": "東大英語対策の全体像｜要約・英作文・リスニング・時間配分｜黒田塾",
                  "h1": "東大英語対策を、設問別ではなく失点原因から組み直す",
                  "desc": "東大英語対策を、読解・要約・英作文・リスニング・時間配分の5領域に分けて診断。過去問を解くだけで終わらず、失点原因から次の1週間の課題へ戻す具体的な学習ループを解説します。",
                  "body": '''<p class="intro">東大英語は、単に「長文をたくさん読む」「過去問を何年分も解く」だけでは改善点が散らばります。まず失点を、読解・要約・英作文・リスニング・時間配分に分け、次の一題で直すことを決めます。</p><nav class="toc" aria-label="このページの目次"><strong>このページで分かること</strong><ol><li><a href="#diagnosis">失点を5領域に分ける</a></li><li><a href="#loop">1週間の復習ループ</a></li><li><a href="#priority">優先順位の決め方</a></li></ol></nav><section id="diagnosis"><h2>まず「何点落としたか」より「どの作業で止まったか」を見る</h2><div class="table-scroll"><table><thead><tr><th>症状</th><th>確認すること</th><th>次の練習</th></tr></thead><tbody><tr><td>本文は読めるが要約が長い</td><td>主張と具体例を分けられたか</td><td>段落ごとに役割を一語で付ける</td></tr><tr><td>英作文で内容が薄い</td><td>日本語段階で理由が2つあるか</td><td>主張→理由→具体化を3文で作る</td></tr><tr><td>最後まで終わらない</td><td>どの大問に予定以上の時間を使ったか</td><td>大問ごとに撤退時刻を決める</td></tr><tr><td>リスニングで後半が崩れる</td><td>音・意味・保持・選択肢のどこで落ちたか</td><td>同じ素材で原因別に聞き直す</td></tr></tbody></table></div></section><section id="loop"><h2>過去問1回を、次の1週間へ変える</h2><ol><li><strong>答案を保存する。</strong>正解した問題も、根拠が曖昧なら印を付けます。</li><li><strong>失点を一つの原因に仮分類する。</strong>語彙不足と構文不足を同時に書かず、まず主因を決めます。</li><li><strong>48時間以内に同種の短い課題を1つ解く。</strong>過去問を丸ごともう一度解く必要はありません。</li><li><strong>1週間後に再テストする。</strong>「分かった」ではなく、同じ判断を再現できるかを見ます。</li></ol><p>復習そのものは<a href="/study-guides/todai-english-review/">東大英語の復習法</a>、時間設計は<a href="/study-guides/todai-english-time-allocation/">120分の時間配分</a>で詳しく扱います。</p></section><section id="priority"><h2>全部弱いときは、得点に近い一箇所から直す</h2><p>課題を5つ同時に始めると、どの練習が効いたか分からなくなります。まず「時間を追加すれば解ける問題」と「時間を追加しても解けない問題」を分けます。前者は処理速度、後者は知識・読解・表現の問題として扱うと、優先順位を決めやすくなります。</p><div class="summary-box"><strong>診断の順番</strong><p>時間不足 → 根拠の取り違え → 日本語での整理 → 英語表現、の順に確認すると、表面的なミスだけを直すのを避けられます。</p></div></section><aside class="learn-links"><h2>東大英語の各論</h2><p><a href="/study-guides/todai-english-summary/">要約対策</a> ／ <a href="/study-guides/todai-english-writing/">英作文対策</a> ／ <a href="/study-guides/todai-listening/">リスニング対策</a></p></aside>'''
              },
              {
                  "slug": "todai-english-time-allocation",
                  "title": "東大英語の時間配分｜120分を崩さない設計と練習法｜黒田塾",
                  "h1": "東大英語の120分を、固定配分ではなく撤退時刻で管理する",
                  "desc": "東大英語の時間配分を、大問ごとの固定分数ではなく「上限・撤退・見直し」の3点で設計する方法を解説。過去問演習の記録から、自分用の120分プランを作る手順を示します。",
                  "body": '''<p class="intro">時間配分は「各大問を何分で解くか」を一度決めて終わりではありません。難易度の揺れがある試験では、予定時間よりも「何分で一旦離れるか」を決める方が実戦的です。</p><section><h2>時間は3種類に分ける</h2><div class="r6-grid"><div><h3>上限</h3><p>その大問に使ってよい最大時間。超えたら、完成度が低くても一旦離れます。</p></div><div><h3>撤退時刻</h3><p>時計の時刻で決めます。「開始から25分」より「試験開始35分後に移る」の方が本番で判断しやすくなります。</p></div><div><h3>見直し枠</h3><p>最後に戻るための時間。最初から0分にすると、一題の詰まりが全体へ波及します。</p></div></div></section><section><h2>120分の架空例</h2><p>次は説明用の一例で、東京大学が推奨する配分ではありません。</p><div class="table-scroll"><table><thead><tr><th>作業</th><th>上限の例</th><th>記録すること</th></tr></thead><tbody><tr><td>全体確認</td><td>5分</td><td>重い設問を先に把握</td></tr><tr><td>読解・要約系</td><td>35分</td><td>本文理解と答案化を分ける</td></tr><tr><td>英作文系</td><td>20分</td><td>構想に使った時間も記録</td></tr><tr><td>その他の読解・文法等</td><td>30分</td><td>止まった設問番号を残す</td></tr><tr><td>リスニング・指定時間帯</td><td>試験形式に従う</td><td>直前の作業を持ち越さない</td></tr><tr><td>戻り・見直し</td><td>残り</td><td>空欄→高得点可能性の順に戻る</td></tr></tbody></table></div><p class="fine-print">実際の大問構成・リスニング実施方法は年度の募集要項・試験問題で確認してください。</p></section><section><h2>3回分の記録で自分用に直す</h2><ol><li>各大問の開始・終了時刻を書く。</li><li>時間を追加したら正解できた問題に印を付ける。</li><li>追加しても解けなかった問題は、時間配分ではなく知識・読解の課題へ回す。</li><li>3回分の中央値を基準に、上限だけを調整する。</li></ol><p>同じ回を何度も送るのではなく、<a href="/study-guides/todai-english-strategy/">東大英語の失点診断</a>とセットで使ってください。</p></section>'''
