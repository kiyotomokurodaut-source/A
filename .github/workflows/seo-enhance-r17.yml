name: Kuroda School R17 Quality and SEO

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-enhance-r17.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuroda-school-r17-publisher
  cancel-in-progress: false

jobs:
  enhance:
    if: github.repository == 'kiyotomokurodaut-source/A' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed r17 changes
        shell: bash
        run: |
          cat > /tmp/apply_kuroda_r17.py <<'PYCODE'
          from __future__ import annotations
          from pathlib import Path
          from html import escape, unescape
          from html.parser import HTMLParser
          import argparse, hashlib, importlib.util, json, re

          # PAYLOAD is inserted by the packaging step. It contains readable source files.
          PAYLOAD = {'components.css': '/* Kuroda School r17: namespaced, system fonts only; no external resources. */\n'
                             '.r17-article,.r17-hub{line-height:1.95;overflow-wrap:anywhere}\n'
                             '.r17-article>section{margin-block:2.6rem}\n'
                             '.r17-article h2,.r17-hub '
                             'h2{font-size:clamp(1.3rem,3.8vw,1.8rem);line-height:1.6;margin-block:1.6rem .7rem}\n'
                             '.r17-article h3{font-size:1.12rem;line-height:1.7;margin-block:1.3rem .5rem}\n'
                             '.r17-article p,.r17-hub p{margin-block:.8rem}\n'
                             '.r17-table{max-width:100%;overflow-x:auto;margin:1rem 0;border:1px solid '
                             '#d7d2c8;border-radius:10px;background:#fff;overscroll-behavior-inline:contain}\n'
                             '.r17-table '
                             'table{border-collapse:collapse;min-width:34rem;width:100%;font-size:.96rem;line-height:1.8}\n'
                             '.r17-table th,.r17-table '
                             'td{padding:.8rem;text-align:left;vertical-align:top;border-bottom:1px solid #dedbd4}\n'
                             '.r17-table thead,.r17-table tfoot{background:#f2eee4;color:#202b35}\n'
                             '.r17-table caption{padding:.8rem;text-align:left;font-size:.88rem;color:#424b53}\n'
                             '.r17-callout{padding:1rem 1.25rem;border-left:4px solid #a08731;border-radius:0 10px '
                             '10px 0;background:#f6f2e6;margin:1.4rem 0}\n'
                             '.r17-answer{background:#fff;border:1px solid #d7d2c8;border-radius:10px;padding:1rem '
