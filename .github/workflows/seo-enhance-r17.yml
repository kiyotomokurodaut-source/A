           'tools/http_audit_r17.py': '#!/usr/bin/env python3\n'
                                      '"""Read-only production smoke checks. Distinguishes HTTP redirects from meta '
                                      'refresh."""\n'
                                      'import argparse,json,time,urllib.request,urllib.error\n'
                                      'from pathlib import Path\n'
                                      'from urllib.parse import urljoin,urlsplit\n'
                                      '\n'
                                      'class NoRedirect(urllib.request.HTTPRedirectHandler):\n'
                                      '    def redirect_request(self,*args,**kwargs):return None\n'
                                      '\n'
                                      'def response(url):\n'
                                      '    opener=urllib.request.build_opener(NoRedirect())\n'
                                      '    '
                                      "request=urllib.request.Request(url,headers={'User-Agent':'KurodaSchool-DeploymentCheck/17','Cache-Control':'no-cache'})\n"
                                      '    try:r=opener.open(request,timeout=20)\n'
                                      '    except urllib.error.HTTPError as e:r=e\n'
                                      '    with r:\n'
                                      "        body=r.read(1_000_000).decode('utf-8','replace')\n"
                                      '        return r.code,dict(r.headers.items()),body\n'
                                      '\n'
                                      'def follow(url):\n'
                                      '    chain=[]\n'
                                      '    for _ in range(6):\n'
                                      '        status,headers,body=response(url)\n'
                                      '        location=next((v for k,v in headers.items() if '
                                      "k.lower()=='location'),None)\n"
                                      "        chain.append({'url':url,'status':status,'location':location})\n"
                                      '        if status not in {301,302,303,307,308} or not location:return '
                                      'chain,body,headers\n'
                                      '        nxt=urljoin(url,location)\n'
                                      '        '
                                      "allowed={'kurodaschool.jp','www.kurodaschool.jp','kurodaschool.com','www.kurodaschool.com','kiyotomokuroda.netlify.app','lively-cake-2d04.kiyotomokurodaut.workers.dev'}\n"
                                      "        if urlsplit(nxt).hostname not in allowed:raise RuntimeError('Unexpected "
                                      "redirect destination: '+nxt)\n"
                                      '        url=nxt\n'
                                      "    raise RuntimeError('Too many redirects')\n"
                                      '\n'
                                      'def main():\n'
                                      '    '
                                      "p=argparse.ArgumentParser();p.add_argument('--wait',type=int,default=0);args=p.parse_args()\n"
                                      "    start=time.monotonic();ready=False;last=''\n"
                                      '    while True:\n'
                                      '        try:\n'
                                      "            st,_,b=response('https://kurodaschool.jp/study-guides/')\n"
                                      "            ready=st==200 and 'data-r17-finder' in b\n"
                                      '        except Exception as e:last=str(e)\n'
                                      '        if ready or time.monotonic()-start>=args.wait:break\n'
                                      '        time.sleep(10)\n'
                                      "    result={'r17_catalogue_live':ready,'checks':[],'note':'Only these public "
                                      "URLs are tested; this does not verify Google indexing or ranking.'}\n"
                                      '    cases=[\n'
                                      "      ('https://kurodaschool.jp/',200,'https://kurodaschool.jp/'),\n"
                                      '      '
                                      "('https://kurodaschool.com/pricing/',301,'https://kurodaschool.jp/pricing/'),\n"
                                      "      ('https://www.kurodaschool.com/',301,'https://kurodaschool.jp/'),\n"
                                      "      ('https://www.kurodaschool.jp/',301,'https://kurodaschool.jp/'),\n"
                                      "      ('https://kiyotomokuroda.netlify.app/',301,'https://kurodaschool.jp/'),\n"
                                      '      '
                                      "('https://lively-cake-2d04.kiyotomokurodaut.workers.dev/',301,'https://kurodaschool.jp/'),\n"
                                      '      '
                                      "('https://lively-cake-2d04.kiyotomokurodaut.workers.dev/pricing/',301,'https://kurodaschool.jp/pricing/'),\n"
                                      '      '
                                      "('https://kurodaschool.jp/__r17_missing_page_check__/',404,'https://kurodaschool.jp/__r17_missing_page_check__/'),\n"
                                      '    ]\n'
                                      '    for url,status,dest in cases:\n'
                                      '        try:\n'
                                      '            chain,body,headers=follow(url)\n'
                                      "            ok=chain[0]['status']==status and chain[-1]['url']==dest and "
                                      "chain[-1]['status']==(404 if status==404 else 200)\n"
                                      '            robots=next((v for k,v in headers.items() if '
                                      "k.lower()=='x-robots-tag'),'')\n"
                                      "            if status!=404 and 'noindex' in robots.lower():ok=False\n"
                                      '            '
                                      "result['checks'].append({'url':url,'ok':ok,'chain':chain,'x_robots_tag':robots})\n"
                                      '        except Exception as '
                                      "e:result['checks'].append({'url':url,'ok':False,'error':str(e)})\n"
                                      "    if last:result['initial_fetch_note']=last\n"
                                      '    '
                                      "Path('r17-http-audit.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')\n"
                                      '    print(json.dumps(result,ensure_ascii=False,indent=2))\n'
                                      "    if not ready or not all(c['ok'] for c in result['checks']):\n"
                                      "        print('::warning::Publication/HTTP check incomplete. Inspect "
                                      "r17-http-audit.json; do not infer success from a browser URL alone.')\n"
                                      '        raise SystemExit(1)\n'
                                      "if __name__=='__main__':main()\n",
           'tools/netlify_prepare_r17.py': '#!/usr/bin/env python3\n'
                                           '"""Generate context-specific headers. Never store preview noindex in '
                                           'production."""\n'
                                           'from pathlib import Path\n'
                                           'import argparse\n'
                                           'import hashlib\n'
                                           'import os\n'
                                           'import re\n'
                                           '\n'
                                           'ROOT = Path(__file__).resolve().parents[1]\n'
                                           '\n'
                                           'def make_headers(root: Path, context: str) -> str:\n'
                                           '    base = (root / '
                                           "'tools/netlify_headers_base_r17.txt').read_text(encoding='utf-8').rstrip()\n"
                                           "    base = re.sub(r'^\\s*X-Robots-Tag:.*\\n?', '', base, flags=re.M | "
                                           're.I)\n'
                                           "    lines = [base, '\\n# One exact asset rule per URL; no conflicting "
                                           "wildcard cache rules.']\n"
                                           "    for path in sorted((root / 'public/assets').rglob('*')):\n"
                                           '        if not path.is_file():\n'
                                           '            continue\n'
                                           '        name = path.name\n'
                                           "        tag = re.search(r'-([0-9a-f]{12})\\.(?:css|js)$', name)\n"
                                           '        immutable = bool(tag and '
                                           'hashlib.sha256(path.read_bytes()).hexdigest()[:12] == tag.group(1))\n'
                                           "        policy = 'public, max-age=31536000, immutable' if immutable else "
                                           "'public, max-age=0, must-revalidate'\n"
                                           "        url = '/' + path.relative_to(root / 'public').as_posix()\n"
                                           "        lines += [url, '  Cache-Control: ' + policy, '']\n"
                                           '    # CONTEXT is provided by Netlify. Missing context means a local '
                                           'production build.\n'
                                           "    if context in {'deploy-preview', 'branch-deploy', 'dev'}:\n"
                                           "        lines += ['# Preview deployments must not compete with the public "
                                           "site.', '/*', '  X-Robots-Tag: noindex, nofollow', '']\n"
                                           "    elif context != 'production':\n"
                                           "        raise ValueError('Unrecognized deploy context: ' + context)\n"
                                           "    return '\\n'.join(lines).rstrip() + '\\n'\n"
                                           '\n'
                                           'def main() -> None:\n'
                                           '    p = argparse.ArgumentParser()\n'
                                           "    p.add_argument('--context', default=os.getenv('CONTEXT', "
                                           "'production'))\n"
                                           '    args = p.parse_args()\n'
                                           '    text = make_headers(ROOT, args.context)\n'
                                           "    (ROOT / 'public/_headers').write_text(text, encoding='utf-8')\n"
                                           "    print('Prepared headers for', args.context)\n"
                                           '\n'
                                           "if __name__ == '__main__':\n"
                                           '    main()\n',
