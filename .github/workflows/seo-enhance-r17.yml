                             '.r17-answer '
                             'summary{font-weight:700;cursor:pointer;min-height:44px;line-height:1.8;color:#254c62;padding:.35rem '
                             '0}\n'
                             '.r17-note,.r17-byline{font-size:.88rem;color:#48555f;line-height:1.85}\n'
                             '.r17-formula{font-size:1.15rem;font-weight:700;letter-spacing:.04em;overflow-x:auto;white-space:nowrap;padding:.8rem;background:#f1f4f5}\n'
                             '.r17-toc{padding:1rem 1.25rem;background:#fff;border:1px solid '
                             '#d7d2c8;border-radius:10px;margin-block:1.4rem}\n'
                             '.r17-toc ol{margin:.5rem 0;padding-left:1.4rem}.r17-toc li{padding:.15rem 0}\n'
                             '.r17-related{margin:2rem 0;padding:1rem 1.2rem;background:#edf3f5;border-radius:10px}\n'
                             '.r17-related h2{margin-top:0}.r17-related ul{padding-left:1.2rem}\n'
                             '.r17-guide-controls{padding:1rem;background:#f1f4f5;border:1px solid '
