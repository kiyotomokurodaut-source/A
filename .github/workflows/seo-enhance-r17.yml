           'components.js': '/* Search/memo run only in this browser; no requests, cookies or storage. */\n'
                            '(() => {\n'
                            "  'use strict';\n"
                            '  const normalize = (s) => String(s || '
                            "'').normalize('NFKC').toLocaleLowerCase('ja').trim();\n"
                            "  const finder = document.querySelector('[data-r17-finder]');\n"
                            '  if (finder) {\n'
                            "    const input = finder.querySelector('[data-r17-query]');\n"
                            "    const group = finder.querySelector('[data-r17-category]');\n"
                            "    const cards = Array.from(document.querySelectorAll('[data-r17-card]'));\n"
                            "    const status = finder.querySelector('[data-r17-status]');\n"
                            "    const empty = document.querySelector('[data-r17-empty]');\n"
                            '    const update = () => {\n'
                            '      const terms = normalize(input.value).split(/\\s+/).filter(Boolean);\n'
                            '      let count = 0;\n'
                            '      for (const card of cards) {\n'
                            '        const text = normalize(card.textContent);\n'
                            '        const shown = (!group.value || card.dataset.category === group.value) && '
                            'terms.every((t) => text.includes(t));\n'
                            '        card.hidden = !shown;\n'
                            '        if (shown) count++;\n'
                            '      }\n'
                            '      status.textContent = `${cards.length}件中${count}件を表示しています。`;\n'
                            '      if (empty) empty.hidden = count !== 0;\n'
                            '    };\n'
                            "    input.addEventListener('input', update);\n"
                            "    group.addEventListener('change', update);\n"
                            "    finder.querySelector('[data-r17-reset]').addEventListener('click', () => {\n"
                            "      input.value = ''; group.value = ''; update(); input.focus();\n"
                            '    });\n'
                            '    update();\n'
                            '  }\n'
                            "  for (const memo of document.querySelectorAll('[data-r17-memo]')) {\n"
                            "    const issue = memo.querySelector('[data-r17-issue]');\n"
                            "    const materials = memo.querySelector('[data-r17-materials]');\n"
                            "    const output = memo.querySelector('[data-r17-output]');\n"
                            "    const status = memo.querySelector('[data-r17-copy-status]');\n"
                            "    const title = document.querySelector('h1')?.textContent?.trim() || '学習ガイド';\n"
                            '    const canonical = document.querySelector(\'link[rel="canonical"]\')?.href || '
                            'location.origin + location.pathname;\n'
                            '    const update = () => {\n'
                            '      output.value = '
                            '`黒田塾の無料相談について\\n読んだページ：${title}\\n${canonical}\\n\\n困っていること：${issue.value.trim() || '
                            "'（ここに記入）'}\\n現在の教材・授業：${materials.value.trim() || '（分かる範囲で記入）'}\\n\\n次に取り組む課題を相談したいです。`;\n"
                            "      status.textContent = '';\n"
                            '    };\n'
                            "    issue.addEventListener('input', update); materials.addEventListener('input', update); "
                            'update();\n'
                            "    memo.querySelector('[data-r17-copy]').addEventListener('click', async () => {\n"
                            '      try {\n'
                            "        if (!navigator.clipboard?.writeText) throw new Error('clipboard unavailable');\n"
                            '        await navigator.clipboard.writeText(output.value);\n'
                            "        status.textContent = 'コピーしました。内容を確認し、LINEにご自身で貼り付けて送信してください。';\n"
                            '      } catch (_) {\n'
                            '        output.focus(); output.select();\n'
                            "        status.textContent = '文章を選択しました。端末の「コピー」を使ってください。';\n"
                            '      }\n'
                            '    });\n'
                            '  }\n'
                            '})();\n',
           'content/comparison.html': '<p '
                                      'class="intro">受験コーチングと個別指導は、名称だけでは内容が決まりません。一般に、コーチングは自習の計画・進捗・振り返りを、個別指導は問題理解や答案の考え方を扱う場面が多いものの、実際の範囲は事業者と契約で異なります。ここでは、学習中の困りごとから必要な支援を選ぶための判断表を示します。</p>\n'
                                      '<section id="r17-compare"><h2>「分からない」と「進められない」を分ける</h2><div '
                                      'class="r17-table"><table><caption>まず確認する場面と支援の候補。効果を保証する表ではありません。</caption><thead><tr><th '
                                      'scope="col">困っている場面</th><th scope="col">先に確かめること</th><th '
                                      'scope="col">検討する支援</th></tr></thead><tbody><tr><th '
                                      'scope="row">解説を読んでも式変形が分からない</th><td>前提知識や基本概念が抜けていないか</td><td>個別授業や学校の質問機会</td></tr><tr><th '
                                      'scope="row">解説は分かるが、次の問題で止まる</th><td>方針を選んだ理由を説明できるか</td><td>類題演習と答案への個別フィードバック</td></tr><tr><th '
                                      'scope="row">教材が多く、毎週終わらない</th><td>課題の量と所要時間を見積もったか</td><td>計画の整理と進捗確認</td></tr><tr><th '
                                      'scope="row">計画を作れるが、崩れた後に直せない</th><td>実績の記録と修正の機会があるか</td><td>学習管理・受験コーチング</td></tr><tr><th '
                                      'scope="row">模試の点数だけ見て終わっている</th><td>誤答から具体的な復習課題を決めたか</td><td>答案分析と復習計画</td></tr></tbody></table></div><p>「勉強時間が足りない」と見える問題の中に、理解不足が隠れていることもあります。自習時間の管理だけを増やす前に、短い一問でどこから説明が必要かを確かめます。</p></section>\n'
                                      '<section '
                                      'id="r17-cases"><h2>三つの架空例で、選び方を確かめる</h2><h3>例A：予備校の授業は足りているが、復習が残る</h3><p>授業をさらに増やすと、復習時間が減ります。まず授業・宿題・移動を一週間に配置し、どの課題が未処理か整理します。理解できているなら、管理面の支援を検討する余地があります。授業そのものが理解できていない場合は、この判断を変えます。</p><h3>例B：参考書を読んでも、二次関数の意味が分からない</h3><p>ページ数の管理だけでは、同じ場所で止まり続けるかもしれません。まずグラフ、式、頂点の関係を説明してもらい、自力で解ける基本問題へつなげます。理解を確認した後に自習計画を組みます。</p><h3>例C：理解も計画も、一人では整理できない</h3><p>授業と面談の両方が候補になります。ただし、最初から最大回数を契約するのではなく、復習に使える時間、学校・塾との役割分担、費用を確認します。改善の判定日を置き、必要な支援を見直す前提で考えます。</p><p '
                                      'class="r17-note">三つの例は説明のための架空設定です。黒田塾の実際の受講者や成果の記録ではありません。</p></section>\n'
                                      '<section '
                                      'id="r17-contract"><h2>契約前に、名前ではなく中身を確認する</h2><p>「質問対応あり」「添削あり」と書かれていても、科目、回数、返信の目安、対象教材は同じとは限りません。口頭の印象だけでなく、契約前に確認できる形で整理します。</p><div '
                                      'class="r17-table"><table><caption>比較時に確認する六項目</caption><thead><tr><th '
                                      'scope="col">項目</th><th scope="col">確認する質問</th></tr></thead><tbody><tr><th '
                                      'scope="row">担当者</th><td>計画を立てる人と、授業・添削をする人は同じか。</td></tr><tr><th '
                                      'scope="row">計画修正</th><td>予定が崩れたとき、いつ、何を見て直すか。</td></tr><tr><th '
                                      'scope="row">質問・添削</th><td>対象科目、教材、回数、提出方法はどこまでか。</td></tr><tr><th '
                                      'scope="row">費用</th><td>月額以外に教材・入会・追加授業などの費用があるか。</td></tr><tr><th '
                                      'scope="row">実施回数</th><td>月の週数や欠席によって、回数と金額はどう変わるか。</td></tr><tr><th '
                                      'scope="row">変更・終了</th><td>プラン変更、振替、解約の条件と連絡方法は何か。</td></tr></tbody></table></div><p>ここでは特定サービスの契約条件を推測して比較していません。黒田塾の金額と対応範囲は<a '
                                      'href="/pricing/">料金・5プランの比較ページ</a>を参照し、記載のない条件は契約前に確認してください。</p></section>\n'
                                      '<section '
                                      'id="r17-decision"><h2>相談前に書ける、短い状況メモ</h2><p>「高3です。英語を何とかしたい」だけでも相談できますが、次のように具体化すると確認するポイントが定まります。</p><div '
                                      'class="r17-callout"><p>例：英単語は覚えていますが、長文で主語を取り違えます。解説を読めば和訳は理解できます。予備校の宿題に週6時間かかり、数学の復習が残っています。授業を増やすべきか、復習計画を直すべきか相談したいです。</p></div><p>最初から正確な原因を診断しておく必要はありません。使っている教材、どこで手が止まるか、今の授業量を分かる範囲で知らせます。答案を共有する場合は、氏名・学校名・受験番号など不要な個人情報を隠してください。</p><p>自分で整理する場合は<a '
                                      'href="/study-guides/university-study-plan/">大学受験の勉強計画の作り方</a>と<a '
                                      'href="/study-guides/mock-exam-review/">模試の復習シート</a>を利用できます。支援内容は<a '
                                      'href="/study-coaching/">学習管理の案内</a>と<a '
                                      'href="/online-tutoring/">個別授業の案内</a>で比較してください。</p></section>\n',
           'content/math.html': '<p '
                                'class="intro">東大文系数学の演習では、答えを再現するだけでなく、なぜその変数・場合分け・式変形を選んだのかを説明できるか確かめます。このページは出題予想ではなく、方針選択を練習するための自作例題と答案点検の手順です。実際の入試問題や大学の公式採点基準ではありません。</p>\n'
                                '<section '
                                'id="r17-start"><h2>最初に「条件・目標・つなぐ操作」を書く</h2><p>問題を見てすぐ計算を始めると、定義域の制限やパラメータの役割を見落としやすくなります。次の三つを区別してください。</p><div '
                                'class="r17-table"><table><caption>解答を始める前の三つの確認</caption><thead><tr><th '
                                'scope="col">項目</th><th scope="col">書き出す内容</th><th '
                                'scope="col">この後の例題の場合</th></tr></thead><tbody><tr><th '
                                'scope="row">条件</th><td>変数の範囲と、使える等式・不等式</td><td>−1 ≤ x ≤ 2、a は実数</td></tr><tr><th '
                                'scope="row">目標</th><td>何を求めるか。何についての場合分けか</td><td>x についての最小値を a で表す</td></tr><tr><th '
                                'scope="row">つなぐ操作</th><td>条件と目標の関係が見える形にする</td><td>平方完成し、頂点の位置を区間と比較する</td></tr></tbody></table></div><p>「最大・最小だから微分」と決めつける必要はありません。式が二次式で、平方完成から頂点と定義域の関係が読めるなら、それが短い道筋になります。微分を使う場合でも、最後に定義域と端点を確認する点は同じです。</p></section>\n'
                                '<section id="r17-problem"><h2>自作例題：パラメータと定義域を分ける</h2><div '
                                'class="r17-callout"><p><strong>問題</strong>\u3000a を実数とする。−1 ≤ x ≤ 2 において、f(x) = x² − '
                                '2ax の最小値 m(a) と、その最小値をとる x '
                                'を求めよ。</p><p>この問題は方針選択を確認する基礎例です。東大入試全体の難度を代表する問題ではありません。</p></div><h3>まず自分で考える</h3><p>ここで動かすのは '
                                'x です。a はひとまず固定し、その値によって答えがどう変わるかを考えます。「x と a '
                                'を同時に自由に動かして最小にする問題」と読み替えてはいけません。</p><details '
                                'class="r17-answer"><summary>発想・場合分け・答案を順に確認する</summary><h3>1．平方完成すると、何が分かるか</h3><p '
                                'class="r17-formula">f(x) = (x − a)² − a²</p><p>a を固定したとき、−a² は定数です。したがって f(x) '
                                'を最小にするには、区間 [−1, 2] の中で (x − a)² を最小にします。これは「区間内で a に最も近い x '
                                'を選ぶ」という意味です。</p><h3>2．場合分けの境界はどこから出るか</h3><p>頂点の x 座標は a '
                                'です。頂点が区間の左、区間内、区間の右にある三つの場合で、a に最も近い区間内の点が変わります。境界の −1 と 2 '
                                'は定義域の端点であり、思いつきで決める値ではありません。</p><div '
                                'class="r17-table"><table><caption>最小値をとる点と最小値</caption><thead><tr><th scope="col">a '
                                'の範囲</th><th scope="col">最小となる x</th><th '
                                'scope="col">m(a)</th></tr></thead><tbody><tr><th scope="row">a &lt; '
                                '−1</th><td>−1</td><td>1 + 2a</td></tr><tr><th scope="row">−1 ≤ a ≤ '
                                '2</th><td>a</td><td>−a²</td></tr><tr><th scope="row">a &gt; 2</th><td>2</td><td>4 − '
                                '4a</td></tr></tbody></table></div><h3>3．そのまま答案にする</h3><p>f(x) = (x − a)² − a² である。−1 '
                                '≤ x ≤ 2 における f(x) の最小値は、この区間内で a に最も近い点で得られる。a &lt; −1 のとき x = −1 で m(a) = 1 + 2a。−1 '
                                '≤ a ≤ 2 のとき x = a で m(a) = −a²。a &gt; 2 のとき x = 2 で m(a) = 4 − 4a。以上が求める最小値と、そのときの x '
                                'である。</p><h3>4．境界で確かめる</h3><p>a = −1 では 1 + 2a = −1 と −a² = −1 が一致します。a = 2 では −a² = '
                                '−4 と 4 − 4a = −4 '
                                'が一致します。境界で式が一致することは点検になりますが、それだけで場合分け全体が証明できるわけではありません。</p></details></section>\n'
                                '<section id="r17-errors"><h2>誤答を、原因まで戻して直す</h2><h3>誤答1：いつでも最小値は −a² '
                                'とする</h3><p>平方完成そのものは正しくても、等号を満たす x = a が定義域に入るとは限りません。たとえば a = 3 のとき、x = 3 '
                                'は区間外です。正しい最小値は x = 2 で −8 であり、−9 ではありません。式だけでなく「その x '
                                'を実際に選べるか」を答案に戻します。</p><h3>誤答2：端点だけを比較する</h3><p>端点の比較だけで最小値が決まるのは、区間内にさらに小さい値がないと確認できる場合です。a '
                                '= 0 なら f(0) = 0 で、端点の f(−1) = 1、f(2) = 4 '
                                'より小さくなります。頂点を候補から落とさないでください。</p><h3>誤答3：最小値だけ書き、達成する点を書かない</h3><p>この例題は「最小値をとる '
                                'x」も要求しています。何を求める設問だったかを最後に読み直し、m(a) と x '
                                'の両方を答えます。途中式が正しくても、要求の一部が抜けていれば答案は未完成です。</p></section>\n'
                                '<section id="r17-transfer"><h2>条件変更：解答を覚えたか、判断を使えるか</h2><p><strong>類題</strong>\u3000a '
                                'を実数とし、0 ≤ x ≤ 3 における g(x) = x² − 2ax + 2 の最小値を求めてください。</p><details '
                                'class="r17-answer"><summary>類題の解答と、共通する判断を見る</summary><p>g(x) = (x − a)² + 2 − a² '
                                'と平方完成します。a &lt; 0 では x = 0 で最小値 2。0 ≤ a ≤ 3 では x = a で最小値 2 − a²。a &gt; 3 では x = 3 '
                                'で最小値 11 − 6a です。</p><p>変わったのは区間の端点と定数項です。「区間内で頂点に最も近い点を選ぶ」という判断は変わりません。境界 a = 0 で 2、a '
                                '= 3 で −7 となることも確認できます。</p></details><p>翌日の確認では解答を隠し、場合分けの境界がなぜ 0 と 3 '
                                'なのかを一文で説明してください。答案の丸暗記ではなく、区間と頂点の位置関係を再現できるかを見ます。</p></section>\n'
                                '<section '
                                'id="r17-review"><h2>難しい過去問に戻すときの点検表</h2><p>この例題で使った点検は、より複雑な問題でも「使った条件」「実現可能性」「場合分けの漏れ」「設問への答え」を見直す入口になります。ただし、一つの基本例が解けたことだけで東大数学への対応が完成したとは判断しません。</p><p>答案に残すのは、条件から根拠をもって導いた内容です。部分点の配点は大学がこのページ向けに公表したものではなく、「この式で何点」と保証することはできません。無関係な式を大量に並べるより、到達した結論と未証明の箇所を区別してください。</p><p><a '
                                'href="/study-guides/todai-math-review/">必要条件と十分条件を点検する東大数学の復習法</a>へ進み、実際の過去問の見直しには<a '
                                'href="/study-guides/todai-kakomon-review/">過去問復習の記録シート</a>を使えます。授業で方針の立て方を確認したい場合は<a '
                                'href="/todai-juku/">東大対策の個別指導案内</a>を確認してください。</p></section>\n',
           'content/planning.html': '<p '
                                    'class="intro">大学受験の計画は、教材名を並べるだけでは実行できません。「目標との差」「取り組む課題」「使える時間」「終えたと判定する条件」の四つを結び付けます。以下の時間・正答率は計画の組み方を説明する架空例で、合格を保証する基準ではありません。</p>\n'
                                    '<section '
                                    'id="r17-diagnosis"><h2>計画の前に、同じ条件で比べられる材料を用意する</h2><p>まず、受験する大学・方式・必要科目・配点・日程を募集要項で確認します。入試制度は年度で変わりうるため、古い学習計画をそのまま使わないでください。そのうえで、現在の答案、模試、学校の試験、使用教材を集めます。</p><p>異なる模試の素点を、そのまま合格最低点から引いて「あと何点」と考えるのは不適切です。問題の難度と採点方法が異なるからです。同一形式の過去問や同じ範囲の確認テストを基準に、どこで失点したかを見ます。</p><div '
                                    'class="r17-table"><table><caption>答案から次の課題を決める記録例</caption><thead><tr><th '
                                    'scope="col">実際に起きたこと</th><th scope="col">仮の原因</th><th '
                                    'scope="col">確かめる課題</th></tr></thead><tbody><tr><th '
                                    'scope="row">英文の単語は分かるが和訳が崩れた</th><td>主語と動詞、修飾関係の誤読</td><td>短い英文3文で構造を説明する</td></tr><tr><th '
                                    'scope="row">数学の解説後は理解できた</th><td>方針を選ぶ理由が定着していない</td><td>翌日に条件を変えた1問を白紙から解く</td></tr><tr><th '
                                    'scope="row">最後の大問が未着手だった</th><td>前半で使いすぎた時間、または読解不足</td><td>終了後に追加時間で解き、原因を分ける</td></tr></tbody></table></div><p>原因は最初から確定させなくて構いません。短い確認で仮説を修正し、必要な教材の範囲を絞ります。</p></section>\n'
                                    '<section '
                                    'id="r17-hierarchy"><h2>年間・月間・週間・毎日で、決めることを分ける</h2><p><strong>年間：</strong>出願と試験の日程、科目ごとの到達目標、確認の機会を置きます。すべての人が同じ月に同じ参考書へ進むわけではありません。</p><p><strong>月間：</strong>次に結果を確かめる材料を決めます。「長文を読む」ではなく、「根拠箇所を説明できる設問を増やす」のように、何を変えるかを明確にします。</p><p><strong>週間：</strong>学校・塾の必須課題を含め、今週扱う量と復習枠を決めます。新しい教材だけで時間を埋めないようにします。</p><p><strong>毎日：</strong>取り組む範囲と、終了条件を記します。「数学2時間」だけでなく、「昨日誤った2問を解き、場合分けの理由を説明する」とします。</p></section>\n'
                                    '<section '
                                    'id="r17-worked-plan"><h2>使える24時間から作る、一週間の計算例</h2><p>以下は三科目の課題を整理する練習用の例です。実際には全受験科目と学校・塾の宿題を含めて計算します。24時間は自習に使える時間の仮定で、全員に求める勉強時間ではありません。</p><div '
                                    'class="r17-table"><table><caption>課題の見積もり。重複して数えず、一つずつ足す。</caption><thead><tr><th '
                                    'scope="col">課題</th><th scope="col">回数と1回の見積もり</th><th scope="col">週の合計</th><th '
                                    'scope="col">終了条件の例</th></tr></thead><tbody><tr><th scope="row">英単語の確認</th><td>20分 '
                                    '× 6回</td><td>120分</td><td>ランダム確認で誤った語を記録</td></tr><tr><th '
                                    'scope="row">英語長文の演習と復習</th><td>90分 × '
                                    '3回</td><td>270分</td><td>誤答の根拠を本文から説明</td></tr><tr><th '
                                    'scope="row">数学の演習と復習</th><td>60分 × '
                                    '4回</td><td>240分</td><td>方針選択の理由を書き直す</td></tr><tr><th '
                                    'scope="row">国語の演習</th><td>60分 × '
                                    '3回</td><td>180分</td><td>設問要求と答案要素を対応</td></tr><tr><th '
                                    'scope="row">学校・塾の必須課題</th><td>45分 × '
                                    '6回</td><td>270分</td><td>提出条件まで確認</td></tr><tr><th '
                                    'scope="row">週末の再テストと計画修正</th><td>60分 × '
                                    '1回</td><td>60分</td><td>残った弱点と翌週の課題を決定</td></tr></tbody><tfoot><tr><th colspan="2" '
                                    'scope="row">課題の合計</th><td colspan="2">1,140分 ＝ '
                                    '19時間</td></tr></tfoot></table></div><p>24時間は1,440分です。1,440 − 1,140 = '
                                    '300分なので、残り5時間を遅れの吸収や必要な休憩の調整に使えます。課題を置いた割合は1,140 ÷ 1,440 ≒ '
                                    '79.2%です。この割合が正解という意味ではなく、実績に合わせて余白を設定した一例です。</p><h3>合計が収まっても、曜日に収まるとは限らない</h3><p>水曜日に使える時間が90分なら、長文90分と単語20分を同じ日に入れると20分超過します。週の合計で余裕があっても、曜日ごとの過密は別の問題です。長文を別日に動かす、単語を別の確保済み時間へ分けるなど、実際の生活に配置し直します。</p><p><a '
                                    'href="/study-guides/weekly-study-plan/#weekly-planner">無料の週間プランナー</a>で、曜日別の予定と実績も照合できます。</p></section>\n'
                                    '<section '
                                    'id="r17-adjust"><h2>予定どおり終わらなかったときの修正例</h2><p>長文を1回90分と見積もったのに、3回とも110分かかったとします。差は20分 '
                                    '× 3回 = '
                                    '60分です。まずは5時間の余白から1時間を使えます。ただし、毎週110分必要なら、翌週も90分と書くのは実績を無視した計画です。</p><p>次週は110分 × '
                                    '3回に直すか、回数・難度・復習範囲を調整します。読む力が不足しているために時間がかかるなら、無理に速く解かせるだけでなく、短い構文練習へ一部を置き換えます。「遅れたから翌日を倍にする」以外の修正を持ってください。</p><div '
                                    'class="r17-callout"><h3>修正するときの順序</h3><p>①実際の所要時間を記録する → ②時間不足と理解不足を分ける → '
                                    '③課題量または内容を変える → ④次の確認日を置く、の順です。睡眠を削ることを最初の調整弁にはしません。</p></div></section>\n'
                                    '<section '
                                    'id="r17-weekly-note"><h2>週末に残す、三行の振り返り</h2><p>「今週できるようになったこと」「まだ一人でできないこと」「来週変える一つ」を書きます。勉強時間だけでは見えない変化を確認できます。正答を覚えている同じ問題だけでなく、必要に応じて初見の類題でも確認してください。</p><p>一人で優先順位が定まらない場合は<a '
                                    'href="/study-coaching/">学習管理・受験コーチングの案内</a>を、問題の理解そのものが難しい場合は<a '
                                    'href="/online-tutoring/">オンライン個別指導の案内</a>を確認できます。<a '
                                    'href="/study-guides/coaching-vs-private-tutoring/">二つの支援の違い</a>も先に比較できます。</p></section>\n',
           'content/writing.html': '<p '
                                   'class="intro">このページでは、意見を述べる英作文を「設問条件・主張・理由・英語表現・見直し」に分け、自作課題で練習します。和文英訳や描写など、別の指示がある問題には同じ型を機械的に当てはめません。語数や解答条件は受験する年度の問題文を最優先にしてください。</p>\n'
                                   '<section '
                                   'id="r17-writing-start"><h2>英語を書く前に、設問への答えを一文にする</h2><p>最初に「何について判断する問題か」を確認します。「授業中のスマートフォンの自由使用に賛成か」と聞かれているのに、スマートフォンの一般的な便利さだけを説明すると、設問への答えが曖昧になります。</p><p>次に立場を一文にし、それを支える理由を置きます。理由の数を二つに固定する必要はありません。指定語数の中で、一つの理由を具体化した方が伝わる場合もあります。「主張→理由→具体化」は考えるための補助で、すべての問題の公式解法ではありません。</p><div '
                                   'class="r17-table"><table><caption>構想メモの作り方</caption><thead><tr><th '
                                   'scope="col">確認すること</th><th scope="col">今回の構想例</th></tr></thead><tbody><tr><th '
                                   'scope="row">主張</th><td>自由使用には反対。ただし教師が目的を指定する使用は認める。</td></tr><tr><th '
                                   'scope="row">理由</th><td>学習目的で開いても、通知やゲームで注意がそれることがある。</td></tr><tr><th '
                                   'scope="row">具体化</th><td>情報確認や実験記録などに目的と時間を限定すれば、道具として使える。</td></tr></tbody></table></div></section>\n'
                                   '<section id="r17-writing-task"><h2>自作課題：60～80語で立場と理由を書く</h2><div '
                                   'class="r17-callout"><p lang="en"><strong>Practice task:</strong> Should students '
                                   'be allowed to use smartphones freely during lessons? Write 60–80 words explaining '
                                   'your '
                                   'view.</p><p>これは黒田塾が作成した練習課題です。東京大学の実際の入試問題ではなく、この練習の60～80語という指定が本試験で毎回使われるという意味でもありません。</p></div><details '
                                   'class="r17-answer"><summary>72語の答案例・全文和訳・文ごとの役割を見る</summary><p lang="en" '
                                   'id="r17-writing-model">Students should not use smartphones freely during lessons. '
                                   'Even when they intend to study, messages and games can draw their attention away '
                                   'from the class. However, teachers should be able to permit phones for a clearly '
                                   'defined task, such as checking a fact or recording an experiment. This rule '
                                   'preserves the educational benefits of the devices while reducing unnecessary '
                                   'distractions. The purpose and duration of phone use should be clear to '
                                   'everyone.</p><p><strong>語数：</strong>空白で区切った語を数えて72語です。この例には短縮形やハイフン語を使っていません。</p><h3>全文和訳</h3><p>生徒は授業中にスマートフォンを自由に使うべきではない。勉強するつもりでも、メッセージやゲームによって授業から注意がそれることがある。しかし教師は、事実を確認したり実験を記録したりするような、目的を明確に定めた課題のためには使用を認められるべきだ。このルールなら、不必要な注意散漫を減らしながら機器の教育上の利点を保てる。使用目的と使用時間は、全員に明確であるべきだ。</p><h3>文ごとの役割</h3><p>第1文は自由使用への立場、第2文は理由、第3文は条件付きで認める例外と具体例、第4文はその条件が必要な理由、第5文は条件の明確化です。「自由使用への反対」と「限定した使用の容認」は、対象を区別しているので矛盾しません。</p><p>答案の良さを難語の数で判断しないでください。設問に答え、立場と理由の関係が読み取れ、指定語数を満たすかを確認します。この例が唯一の正解でも、大学の公式採点例でもありません。</p></details></section>\n'
                                   '<section id="r17-writing-errors"><h2>誤答例から、直す順序を確認する</h2><div '
                                   'class="r17-callout"><p><strong>説明用の誤答：</strong><span lang="en">I agree students '
                                   'uses smartphones freely. It is useful because we can get many informations. So '
                                   'phones are '
                                   'bad.</span></p><p>実際の生徒の答案ではなく、誤りを説明するための自作例です。</p></div><h3>1．最初に立場の食い違いを直す</h3><p>自由使用に賛成する書き出しなのに、最後が「スマートフォンは悪い」では、何に賛成・反対しているか分かりません。自由使用に反対し、学習目的の限定使用には賛成するなら、その区別を明示します。単語だけを正しても、この食い違いは残ります。</p><h3>2．主語と動詞を対応させる</h3><p><span '
                                   'lang="en">students uses</span> は、複数主語に三人称単数の形を置いています。<span lang="en">students '
                                   'use</span> とします。「私は～に賛成だ」と述べるなら、<span lang="en">I agree that ...</span> '
                                   'のように節の関係を明確にするか、<span lang="en">I think students should ...</span> '
                                   'と書く方法があります。</p><h3>3．名詞の数え方を直す</h3><p><span lang="en">information</span> '
                                   'は、ここでは不可算名詞です。<span lang="en">many informations</span> ではなく、<span lang="en">a lot '
                                   'of information</span> または意味を絞って <span lang="en">useful information</span> '
                                   'などとします。辞書で名詞の意味だけでなく、可算・不可算と用例を確認してください。</p><h3>4．接続語で論理を作ったつもりにならない</h3><p><span '
                                   'lang="en">So</span> '
                                   'を加えるだけでは、前の文から結論が導けるようにはなりません。「便利だから悪い」という関係を無理につなぐより、どの条件では便利で、どの条件では問題かを言い直します。</p><p>このページでは具体的な減点数を設定していません。公式採点基準が分からないまま、「このミスは必ず2点減点」などと断定しないためです。</p></section>\n'
                                   '<section '
                                   'id="r17-writing-check"><h2>見直しの順序と、次の練習</h2><p><strong>第一に設問：</strong>質問に答えているか、指定された立場・語数・内容を満たすか。</p><p><strong>第二に論理：</strong>主張と理由が対応しているか、理由の飛躍や矛盾がないか。</p><p><strong>第三に英文：</strong>主語と動詞、時制、単複、冠詞、前置詞を確認します。終了直前に、書けていた文を不慣れな難しい構文へ全面変更しないでください。</p><p>類題として、「授業中のタブレット利用を、教師が課題を指定した場合に限ることに賛成か」を60～80語で書いてみてください。スマートフォンという語だけを置き換えるのではなく、設問が最初から限定使用を前提としている点を構想へ反映します。</p><p><a '
                                   'href="/study-guides/todai-english-summary/">日本語で答える要約問題</a>とは出力言語と目的を区別します。復習全体は<a '
                                   'href="/study-guides/todai-english-review/">東大英語の復習法</a>、試験中の作業配分は<a '
                                   'href="/study-guides/todai-english-time-allocation/">120分の時間配分例</a>で確認できます。</p></section>\n',
           'tools/fingerprint_assets_r17.py': '#!/usr/bin/env python3\n'
                                              '"""Refresh CSS/JS filenames after content edits, preserving legacy '
                                              'URLs."""\n'
                                              'from pathlib import Path\n'
                                              'from html.parser import HTMLParser\n'
                                              'import hashlib,json,re\n'
                                              'ROOT=Path(__file__).resolve().parents[1]\n'
                                              'class Refs(HTMLParser):\n'
                                              ' def __init__(self,raw):\n'
                                              '  super().__init__();self.assets=[];self.feed(raw)\n'
                                              ' def handle_starttag(self,tag,attrs):\n'
                                              '  a=dict(attrs);ref=None\n'
                                              "  if tag=='script':ref=a.get('src')\n"
                                              "  if tag=='link' and 'stylesheet' in "
                                              "a.get('rel','').split():ref=a.get('href')\n"
