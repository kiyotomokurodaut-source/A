<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ねむり VRM ビューア</title>
<style>
  :root { --bg: #dfe8ff; --ink: #282c6e; --chip: #ffffffcc; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  #ui button { border: 0; border-radius: 999px; padding: 8px 14px; background: var(--chip); color: var(--ink);
    font: inherit; font-size: 14px; cursor: pointer; }
  #ui button[aria-pressed="true"] { background: #fd54f7; color: #fff; }
  #msg { position: fixed; top: 12px; left: 12px; font-size: 14px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<div id="msg">読み込み中…</div>
<div id="ui"></div>
<script type="module">
// Local preview of nemuri.vrm. Serve this folder over HTTP (file:// cannot
// fetch the model), e.g.  python3 -m http.server 8765  ->  /viewer.html
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe8ff);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 20);
camera.position.set(0, 1.3, 1.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.update();
const light = new THREE.DirectionalLight(0xffffff, Math.PI);
light.position.set(0.6, 1.2, 1.5);
scene.add(light, new THREE.AmbientLight(0xffffff, 0.4));

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
const gltf = await loader.loadAsync("nemuri.vrm");
const vrm = gltf.userData.vrm;
VRMUtils.rotateVRM0(vrm);
scene.add(vrm.scene);
document.getElementById("msg").textContent = "ドラッグで回転・ホイールで拡大";

// relaxed arms instead of the T-pose
const h = vrm.humanoid;
h.getNormalizedBoneNode("leftUpperArm").rotation.z = 1.2;
h.getNormalizedBoneNode("rightUpperArm").rotation.z = -1.2;

const expressions = [
  ["neutral", "ふつう"], ["happy", "Joy"], ["relaxed", "Fun"], ["angry", "Angry"],
  ["sad", "Sorrow"], ["aa", "あ"], ["ih", "い"], ["ou", "う"], ["ee", "え"], ["oh", "お"],
];
let current = "neutral";
const ui = document.getElementById("ui");
for (const [name, label] of expressions) {
  const b = document.createElement("button");
  b.textContent = label;
  b.setAttribute("aria-pressed", name === current);
  b.onclick = () => {
    current = name;
    ui.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  };
  ui.append(b);
}

// blink every few seconds, sway a little so the hair springs move
const clock = new THREE.Clock();
let nextBlink = 2;
function tick() {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  for (const [name] of expressions) {
    if (name !== "neutral") vrm.expressionManager.setValue(name, name === current ? 1 : 0);
  }
  let blink = 0;
  if (t > nextBlink) {
    const k = (t - nextBlink) / 0.15;
    blink = k < 1 ? Math.sin(k * Math.PI) : 0;
    if (k >= 1) nextBlink = t + 2 + Math.random() * 3;
  }
  vrm.expressionManager.setValue("blink", current === "happy" ? 0 : blink);
  h.getNormalizedBoneNode("spine").rotation.y = Math.sin(t * 0.8) * 0.08;
  h.getNormalizedBoneNode("head").rotation.z = Math.sin(t * 0.6) * 0.06;
  vrm.lookAt.lookAt(camera.position);
  vrm.update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
